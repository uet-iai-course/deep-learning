<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Hai nhánh khóa và giá trị trong chú ý chéo Bahdanau</title>
  <desc id="desc">Mỗi trạng thái mã hóa h i đi theo nhánh khóa vào hàm điểm và softmax để tạo alpha t phẩy i, đồng thời đi theo nhánh giá trị vào tổng alpha t phẩy i nhân h i để tạo ngữ cảnh c t phẩy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/>
    </marker>
  </defs>

  <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3">
    <rect x="40" y="60" width="190" height="66" rx="10"/>
    <rect x="300" y="105" width="220" height="110" rx="10"/>
    <rect x="575" y="120" width="175" height="82" rx="10"/>
    <rect x="805" y="120" width="220" height="82" rx="10"/>
    <rect x="835" y="290" width="160" height="66" rx="10"/>
  </g>
  <g fill="#e8f5e9" stroke="#2e7d32" stroke-width="3">
    <rect x="55" y="330" width="130" height="62" rx="10"/>
    <rect x="220" y="330" width="130" height="62" rx="10"/>
    <rect x="385" y="330" width="130" height="62" rx="10"/>
  </g>

  <g font-family="Arial" font-size="23" text-anchor="middle" fill="#263238">
    <text x="135" y="101">truy vấn s(t′−1)</text>
    <text x="410" y="137">hàm điểm</text>
    <text x="410" y="169">e(t′,i) = f_att(</text>
    <text x="410" y="197">s(t′−1), h(i))</text>
    <text x="662" y="151">softmax nguồn</text>
    <text x="662" y="180">α(t′,i)</text>
    <text x="915" y="151">tổng có trọng số</text>
    <text x="915" y="180">Σ_i α(t′,i) h(i)</text>
    <text x="915" y="332">ngữ cảnh c(t′)</text>
    <text x="120" y="368">h(1)</text>
    <text x="285" y="368">h(2)</text>
    <text x="450" y="368">h(3)</text>
  </g>

  <g stroke="#2e7d32" stroke-width="4" fill="none">
    <path d="M120 330 V286"/>
    <path d="M285 330 V286"/>
    <path d="M450 330 V286"/>
    <path d="M120 286 H520"/>
  </g>
  <text x="310" y="274" font-family="Arial" font-size="22" text-anchor="middle" fill="#2e7d32">H[1:T_s] — trạng thái nguồn</text>

  <g stroke="#2f3e7a" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M230 93 C270 93 280 137 295 151"/>
    <path d="M430 286 C430 250 410 235 410 220"/>
    <path d="M520 161 H570"/>
    <path d="M750 161 H800"/>
    <path d="M520 286 C665 286 745 238 815 204"/>
    <path d="M915 202 V285"/>
  </g>
  <g font-family="Arial" font-size="22" text-anchor="middle" fill="#b15a2b">
    <text x="405" y="238">nhánh khóa</text>
    <text x="685" y="270">nhánh giá trị</text>
  </g>
</svg>
