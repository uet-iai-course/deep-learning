<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Ma trận chú ý tự xây có nhãn ký hiệu nguồn và đích</title>
  <desc id="desc">Ba hàng ký hiệu đích comemos, pan, nosotros và ba cột ký hiệu nguồn we, eat, bread; mỗi hàng trọng số cộng bằng một.</desc>
