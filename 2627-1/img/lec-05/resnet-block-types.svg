<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="270" viewBox="0 0 1050 270" role="img"><title>Hai loại khối ResNet</title><desc>Khối cơ bản có hai tầng 3 nhân 3; khối cổ chai có 1 nhân 1, 3 nhân 3, 1 nhân 1.</desc><g font-family="Arial" text-anchor="middle"><text x="260" y="35" font-size="24" fill="#2f3e7a">Khối cơ bản</text><text x="770" y="35" font-size="24" fill="#2f3e7a">Khối cổ chai</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"><rect x="80" y="90" width="150" height="80" rx="8"/><rect x="290" y="90" width="150" height="80" rx="8"/><rect x="550" y="90" width="130" height="80" rx="8"/><rect x="720" y="90" width="130" height="80" rx="8"/><rect x="890" y="90" width="130" height="80" rx="8"/></g><g font-size="22"><text x="155" y="125">3×3</text><text x="365" y="125">3×3</text><text x="615" y="125">1×1</text><text x="785" y="125">3×3</text><text x="955" y="125">1×1</text><text x="155" y="153">C→C</text><text x="365" y="153">C→C</text><text x="615" y="153">256→64</text><text x="785" y="153">64→64</text><text x="955" y="153">64→256</text></g><g stroke="#2f3e7a" stroke-width="3"><path d="M230 130h60"/><path d="M680 130h40"/><path d="M850 130h40"/></g></g></svg>
