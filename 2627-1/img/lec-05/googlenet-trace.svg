<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">Dấu vết toàn mạng GoogLeNet</title>
  <desc id="desc">Phần gốc đưa ảnh về 192 kênh ở 28 nhân 28; ba cụm gồm hai, năm và hai khối Inception được ngăn bởi phép gộp; cuối cùng là gộp trung bình toàn cục và tầng phân loại.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2f3e7a"/></marker></defs>
  <rect width="1180" height="360" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#263238">
    <g stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)" fill="none">
      <path d="M145 165H185"/><path d="M335 165H375"/><path d="M535 165H575"/><path d="M735 165H775"/><path d="M935 165H975"/>
    </g>
    <g stroke="#2f3e7a" stroke-width="3">
      <rect x="15" y="105" width="130" height="120" rx="10" fill="#edf4ff"/>
      <rect x="185" y="85" width="150" height="160" rx="10" fill="#edf4ff"/>
      <rect x="375" y="85" width="160" height="160" rx="10" fill="#f7efe6" stroke="#b15a2b"/>
      <rect x="575" y="85" width="160" height="160" rx="10" fill="#f7efe6" stroke="#b15a2b"/>
      <rect x="775" y="85" width="160" height="160" rx="10" fill="#f7efe6" stroke="#b15a2b"/>
      <rect x="975" y="105" width="185" height="120" rx="10" fill="#edf4ff"/>
    </g>
    <g font-size="25" font-weight="700" fill="#2f3e7a">
      <text x="80" y="140">Ảnh</text><text x="260" y="120">Phần gốc</text><text x="455" y="120">Cụm 1</text><text x="655" y="120">Cụm 2</text><text x="855" y="120">Cụm 3</text><text x="1068" y="140">Phần đầu</text>
    </g>
    <g font-size="23">
      <text x="80" y="180">3×224²</text>
      <text x="260" y="160">ba tích chập</text><text x="260" y="195">192×28²</text>
      <text x="455" y="160">2 khối</text><text x="455" y="195">480×28²</text><text x="455" y="225">gộp ↓2</text>
      <text x="655" y="160">5 khối</text><text x="655" y="195">832×14²</text><text x="655" y="225">gộp ↓2</text>
      <text x="855" y="160">2 khối</text><text x="855" y="195">1024×7²</text>
      <text x="1068" y="175">gộp toàn cục</text><text x="1068" y="205">1024 → 1000</text>
    </g>
    <text x="590" y="310" font-size="25" fill="#2f3e7a">Tổng cộng 9 khối Inception: 2 + 5 + 2</text>
  </g>
</svg>
