<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" role="img" aria-labelledby="title desc">
  <title id="title">Phần gốc GoogLeNet</title>
  <desc id="desc">Ba tầng tích chập và hai tầng gộp được tách riêng: ảnh 224 qua tích chập 7 nhân 7, gộp, tích chập 1 nhân 1, tích chập 3 nhân 3 và gộp để đạt 192 kênh ở độ phân giải 28 nhân 28.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2f3e7a"/></marker></defs>
  <rect width="1180" height="330" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#263238">
    <g stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)" fill="none"><path d="M145 150H175"/><path d="M325 150H355"/><path d="M505 150H535"/><path d="M685 150H715"/><path d="M865 150H895"/><path d="M1045 150H1075"/></g>
    <g stroke="#2f3e7a" stroke-width="3"><rect x="5" y="100" width="140" height="100" rx="9" fill="#edf4ff"/><rect x="175" y="80" width="150" height="140" rx="9" fill="#f7efe6" stroke="#b15a2b"/><rect x="355" y="100" width="150" height="100" rx="9" fill="#edf4ff"/><rect x="535" y="80" width="150" height="140" rx="9" fill="#f7efe6" stroke="#b15a2b"/><rect x="715" y="80" width="150" height="140" rx="9" fill="#f7efe6" stroke="#b15a2b"/><rect x="895" y="100" width="150" height="100" rx="9" fill="#edf4ff"/><rect x="1075" y="100" width="100" height="100" rx="9" fill="#edf4ff"/></g>
    <g font-size="23"><text x="75" y="142">3×224²</text><text x="75" y="174">đầu vào</text><text x="250" y="125">tích chập 7×7</text><text x="250" y="158">s=2, p=3</text><text x="250" y="192">64×112²</text><text x="430" y="142">gộp 3×3</text><text x="430" y="174">s=2, p=1</text><text x="610" y="125">tích chập 1×1</text><text x="610" y="158">s=1, p=0</text><text x="610" y="192">64×56²</text><text x="790" y="125">tích chập 3×3</text><text x="790" y="158">s=1, p=1</text><text x="790" y="192">192×56²</text><text x="970" y="142">gộp 3×3</text><text x="970" y="174">s=2, p=1</text><text x="1125" y="142">192×28²</text><text x="1125" y="174">đầu ra</text></g>
    <text x="590" y="285" font-size="25" fill="#2f3e7a">Ba tầng tích chập; hai tầng gộp không có trọng số</text>
  </g>
</svg>
