<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">Tái dùng véc-tơ đặc trưng cho mô tả ảnh</title><desc id="d">Ảnh đi qua mạng tích chập tiền huấn luyện thành véc-tơ đặc trưng rồi vào mô hình sinh chuỗi.</desc><rect width="1000" height="280" fill="#fff"/><g font-family="Arial" text-anchor="middle"><rect x="40" y="75" width="150" height="130" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="115" y="148" font-size="26">ảnh</text><rect x="280" y="75" width="220" height="130" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="390" y="125" font-size="25">mạng tích chập</text><text x="390" y="165" font-size="23">tiền huấn luyện</text><rect x="590" y="105" width="140" height="70" rx="8" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="660" y="148" font-size="24">véc-tơ</text><rect x="820" y="75" width="150" height="130" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="895" y="125" font-size="23">mô hình</text><text x="895" y="160" font-size="23">sinh chuỗi</text><g stroke="#2f3e7a" stroke-width="4"><path d="M190 140h90"/><path d="M500 140h90"/><path d="M730 140h90"/></g></g></svg>
