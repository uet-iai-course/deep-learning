<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Độ rộng và độ chi tiết của biên quyết định</title><desc id="desc">Ba ô minh họa biên tuyến tính, biên gấp khúc với ít đơn vị ẩn và biên nhiều đoạn hơn với nhiều đơn vị ẩn; đây là sơ đồ khái niệm, không phải định lượng.</desc>
  <style>text{font-family:Arial}.box{fill:#fff;stroke:#90a4ae;stroke-width:2}.bd{fill:none;stroke:#b15a2b;stroke-width:6}</style><g transform="translate(15,0)"><rect class="box" x="15" y="45" width="270" height="250" rx="10"/><text x="150" y="30" text-anchor="middle" font-size="22">Tuyến tính</text><line class="bd" x1="55" y1="255" x2="245" y2="90"/></g><g transform="translate(330,0)"><rect class="box" x="15" y="45" width="270" height="250" rx="10"/><text x="150" y="30" text-anchor="middle" font-size="22">Tầng ẩn hẹp</text><path class="bd" d="M45 260L95 210L140 225L190 125L255 100"/></g><g transform="translate(645,0)"><rect class="box" x="15" y="45" width="270" height="250" rx="10"/><text x="150" y="30" text-anchor="middle" font-size="22">Tầng ẩn rộng hơn</text><path class="bd" d="M40 260L75 205L110 240L140 175L170 195L205 110L255 90"/></g><text x="480" y="335" text-anchor="middle" font-size="18" fill="#666">Sơ đồ khái niệm: nhiều đơn vị có thể ghép nhiều đoạn tuyến tính hơn</text>
</svg>
