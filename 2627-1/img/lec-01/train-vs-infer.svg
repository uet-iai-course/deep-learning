<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Huấn luyện và suy luận</title><desc id="desc">Huấn luyện dùng dữ liệu có nhãn, hàm mất mát và tối ưu để tìm tham số; suy luận giữ tham số cố định và tạo dự đoán cho đầu vào mới.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial}.b{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}.l{stroke:#2f3e7a;stroke-width:3;marker-end:url(#a)}</style><text x="35" y="45" font-size="26" font-weight="700">Huấn luyện</text><rect class="b" x="40" y="75" width="180" height="70" rx="10"/><text x="130" y="118" text-anchor="middle" font-size="22">(X, y)</text><line class="l" x1="220" y1="110" x2="330" y2="110"/><rect class="b" x="345" y="75" width="210" height="70" rx="10"/><text x="450" y="105" text-anchor="middle" font-size="21">mất mát + tối ưu</text><text x="450" y="132" text-anchor="middle" font-size="18">cập nhật θ</text><line class="l" x1="555" y1="110" x2="665" y2="110"/><rect class="b" x="680" y="75" width="180" height="70" rx="10"/><text x="770" y="118" text-anchor="middle" font-size="22">θ đã học</text><text x="35" y="225" font-size="26" font-weight="700">Suy luận</text><rect class="b" x="40" y="255" width="180" height="70" rx="10"/><text x="130" y="298" text-anchor="middle" font-size="22">x mới</text><line class="l" x1="220" y1="290" x2="330" y2="290"/><rect class="b" x="345" y="255" width="210" height="70" rx="10"/><text x="450" y="282" text-anchor="middle" font-size="21">fθ</text><text x="450" y="310" text-anchor="middle" font-size="18">θ giữ cố định</text><line class="l" x1="555" y1="290" x2="665" y2="290"/><rect class="b" x="680" y="255" width="180" height="70" rx="10"/><text x="770" y="298" text-anchor="middle" font-size="22">ŷ</text></svg>
