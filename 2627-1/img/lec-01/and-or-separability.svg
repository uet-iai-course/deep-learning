<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">AND và OR tách tuyến tính</title>
  <desc id="desc">Hai hệ trục biểu diễn bốn điểm Boolean. AND và OR đều có một đường thẳng phân tách hai lớp.</desc>
  <style>text{font-family:Arial,sans-serif}.ax{stroke:#333;stroke-width:2}.sep{stroke:#b15a2b;stroke-width:6}.p0{fill:#fff;stroke:#2f3e7a;stroke-width:5}.p1{fill:#2f3e7a;stroke:#2f3e7a;stroke-width:3}</style>
  <g transform="translate(70,0)"><text x="150" y="35" text-anchor="middle" font-size="28" font-weight="700">AND</text><line class="ax" x1="55" y1="285" x2="270" y2="285"/><line class="ax" x1="55" y1="285" x2="55" y2="60"/><text x="280" y="292" font-size="20">x₁</text><text x="38" y="52" font-size="20">x₂</text><circle class="p0" cx="75" cy="265" r="11"/><circle class="p0" cx="75" cy="90" r="11"/><circle class="p0" cx="245" cy="265" r="11"/><circle class="p1" cx="245" cy="90" r="11"/><line class="sep" x1="125" y1="75" x2="270" y2="225"/></g>
  <g transform="translate(500,0)"><text x="150" y="35" text-anchor="middle" font-size="28" font-weight="700">OR</text><line class="ax" x1="55" y1="285" x2="270" y2="285"/><line class="ax" x1="55" y1="285" x2="55" y2="60"/><text x="280" y="292" font-size="20">x₁</text><text x="38" y="52" font-size="20">x₂</text><circle class="p0" cx="75" cy="265" r="11"/><circle class="p1" cx="75" cy="90" r="11"/><circle class="p1" cx="245" cy="265" r="11"/><circle class="p1" cx="245" cy="90" r="11"/><line class="sep" x1="55" y1="170" x2="165" y2="285"/></g>
</svg>
