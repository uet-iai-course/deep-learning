<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Cấu trúc mạng perceptron đa lớp</title><desc id="desc">Hai đặc trưng đầu vào nối đầy đủ đến ba đơn vị ẩn có kích hoạt, rồi đến một đơn vị đầu ra.</desc>
  <style>.e{stroke:#90a4ae;stroke-width:2}.x{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.h{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}.y{fill:#e8f5e9;stroke:#2e7d32;stroke-width:3}text{font-family:Arial}</style><g class="e"><path d="M210 145L480 85M210 145L480 200M210 145L480 315M210 275L480 85M210 275L480 200M210 275L480 315M480 85L750 200M480 200L750 200M480 315L750 200"/></g><g class="x"><circle cx="210" cy="145" r="34"/><circle cx="210" cy="275" r="34"/></g><g class="h"><circle cx="480" cy="85" r="34"/><circle cx="480" cy="200" r="34"/><circle cx="480" cy="315" r="34"/></g><circle class="y" cx="750" cy="200" r="38"/><g text-anchor="middle"><text x="210" y="65" font-size="24" font-weight="700">Đầu vào</text><text x="480" y="35" font-size="24" font-weight="700">Tầng ẩn</text><text x="750" y="125" font-size="24" font-weight="700">Đầu ra</text><text x="210" y="151" font-size="22">x₁</text><text x="210" y="281" font-size="22">x₂</text><text x="480" y="92" font-size="20">h₁</text><text x="480" y="207" font-size="20">h₂</text><text x="480" y="322" font-size="20">h₃</text><text x="750" y="207" font-size="22">ŷ</text></g><text x="345" y="385" text-anchor="middle" font-size="21">H = g(XW₁ + b₁)</text><text x="650" y="385" text-anchor="middle" font-size="21">Z = HW₂ + b₂</text>
</svg>
