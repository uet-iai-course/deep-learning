<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
  <title id="title">XOR tách tuyến tính trong không gian ẩn</title>
  <desc id="desc">Ba vị trí điểm XOR trong không gian ẩn và đường h1 trừ hai h2 trừ không phẩy năm bằng không phân tách hai lớp.</desc>
  <style>text{font-family:Arial,sans-serif}.ax{stroke:#333;stroke-width:3}.p0{fill:#fff;stroke:#2f3e7a;stroke-width:6}.p1{fill:#2f3e7a;stroke:#2f3e7a;stroke-width:3}.sep{stroke:#b15a2b;stroke-width:7}</style>
  <text x="380" y="38" text-anchor="middle" font-size="28" font-weight="700">Tầng ra tách trong H</text><line class="ax" x1="130" y1="350" x2="650" y2="350"/><line class="ax" x1="130" y1="350" x2="130" y2="65"/><text x="662" y="359" font-size="24">h₁</text><text x="105" y="58" font-size="24">h₂</text><circle class="p0" cx="170" cy="315" r="15"/><circle class="p1" cx="370" cy="315" r="17"/><text x="370" y="282" text-anchor="middle" font-size="22">×2</text><circle class="p0" cx="570" cy="135" r="15"/><line class="sep" x1="270" y1="315" x2="570" y2="180"/><text x="485" y="165" font-size="21" fill="#b15a2b">h₁ − 2h₂ − 0.5 = 0</text>
</svg>
