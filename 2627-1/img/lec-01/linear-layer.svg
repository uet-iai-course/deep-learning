<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Một tầng kết nối đầy đủ</title><desc id="desc">Ba nút đầu vào nối đến bốn nút đầu ra; mỗi nút đầu ra dùng một cột trọng số và một độ lệch theo quy ước y bằng x nhân W cộng b.</desc><style>.e{stroke:#90a4ae;stroke-width:2}.i{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.o{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}text{font-family:Arial}</style><g class="e"><path d="M230 80L650 55M230 80L650 145M230 80L650 235M230 80L650 325M230 195L650 55M230 195L650 145M230 195L650 235M230 195L650 325M230 310L650 55M230 310L650 145M230 310L650 235M230 310L650 325"/></g><g class="i"><circle cx="230" cy="80" r="28"/><circle cx="230" cy="195" r="28"/><circle cx="230" cy="310" r="28"/></g><g class="o"><circle cx="650" cy="55" r="28"/><circle cx="650" cy="145" r="28"/><circle cx="650" cy="235" r="28"/><circle cx="650" cy="325" r="28"/></g><text x="105" y="200" font-size="28">x ∈ ℝ³</text><text x="720" y="200" font-size="28">y ∈ ℝ⁴</text><text x="450" y="365" text-anchor="middle" font-size="24">y = xW + b</text></svg>
