<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Perceptron gồm tổng trọng số, độ lệch và hàm ngưỡng</title><desc id="desc">Các đầu vào x1 đến xd nhân trọng số, cộng tại nút z bằng w chuyển vị x cộng b, rồi qua hàm ngưỡng tạo dự đoán.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial}.l{stroke:#2f3e7a;stroke-width:3;marker-end:url(#a)}</style><g font-size="24"><text x="70" y="85">x₁</text><text x="70" y="165">x₂</text><text x="70" y="245">⋮</text><text x="70" y="325">x_d</text></g><g class="l"><line x1="110" y1="78" x2="350" y2="170"/><line x1="110" y1="158" x2="350" y2="185"/><line x1="110" y1="318" x2="350" y2="215"/></g><text x="205" y="90" font-size="20">w₁</text><text x="205" y="155" font-size="20">w₂</text><text x="205" y="305" font-size="20">w_d</text><circle cx="430" cy="195" r="80" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="430" y="185" text-anchor="middle" font-size="25">z = wᵀx + b</text><text x="430" y="220" text-anchor="middle" font-size="21">phép affine</text><line class="l" x1="510" y1="195" x2="625" y2="195"/><rect x="640" y="135" width="150" height="120" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="715" y="185" text-anchor="middle" font-size="22">ngưỡng</text><text x="715" y="220" text-anchor="middle" font-size="24">ŷ ∈ {0,1}</text></svg>
