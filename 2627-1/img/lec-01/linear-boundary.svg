<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Biên quyết định affine trong hai chiều</title><desc id="desc">Hai nhóm điểm nằm hai phía của đường thẳng w1 x1 cộng w2 x2 cộng b bằng không.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#333"/></marker></defs><g stroke="#333" stroke-width="3" marker-end="url(#a)"><line x1="90" y1="355" x2="630" y2="355"/><line x1="90" y1="355" x2="90" y2="45"/></g><text x="640" y="363" font-size="22">x₁</text><text x="72" y="38" font-size="22">x₂</text><line x1="175" y1="330" x2="555" y2="85" stroke="#b15a2b" stroke-width="6"/><text x="445" y="75" font-size="21" fill="#b15a2b">wᵀx + b = 0</text><g fill="#2f3e7a" stroke="#2f3e7a"><circle cx="175" cy="135" r="10"/><circle cx="235" cy="105" r="10"/><circle cx="280" cy="165" r="10"/><circle cx="335" cy="110" r="10"/></g><g fill="#fff" stroke="#b15a2b" stroke-width="5"><circle cx="360" cy="300" r="10"/><circle cx="430" cy="265" r="10"/><circle cx="505" cy="290" r="10"/><circle cx="550" cy="235" r="10"/></g></svg>
