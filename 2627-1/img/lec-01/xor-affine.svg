<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
  <title id="title">XOR sau phép affine của mạng minh họa</title>
  <desc id="desc">Với W1 có mọi phần tử bằng một và b1 bằng không âm một, bốn điểm thành không âm một, một không hai lần, và hai một. Trục a2 hiển thị cả miền âm. Điểm nhãn một nằm giữa hai điểm nhãn không nên chưa tách tuyến tính.</desc>
  <style>text{font-family:Arial,sans-serif}.ax{stroke:#333;stroke-width:3}.tick{stroke:#777;stroke-width:2}.p0{fill:#fff;stroke:#2f3e7a;stroke-width:6}.p1{fill:#2f3e7a;stroke:#2f3e7a;stroke-width:3}.hull0{stroke:#b15a2b;stroke-width:5;stroke-dasharray:11 8}</style>
  <text x="380" y="38" text-anchor="middle" font-size="28" font-weight="700">A = XW₁ + b₁</text><line class="ax" x1="110" y1="240" x2="650" y2="240"/><line class="ax" x1="170" y1="380" x2="170" y2="65"/><text x="662" y="248" font-size="24">a₁</text><text x="145" y="58" font-size="24">a₂</text><line class="tick" x1="160" y1="360" x2="180" y2="360"/><text x="140" y="367" text-anchor="end" font-size="20">−1</text><line class="tick" x1="160" y1="240" x2="180" y2="240"/><text x="140" y="247" text-anchor="end" font-size="20">0</text><line class="tick" x1="160" y1="120" x2="180" y2="120"/><text x="140" y="127" text-anchor="end" font-size="20">1</text><text x="170" y="270" text-anchor="middle" font-size="20">0</text><text x="370" y="270" text-anchor="middle" font-size="20">1</text><text x="570" y="270" text-anchor="middle" font-size="20">2</text><line class="hull0" x1="170" y1="360" x2="570" y2="120"/><circle class="p0" cx="170" cy="360" r="15"/><circle class="p1" cx="370" cy="240" r="18"/><text x="370" y="205" text-anchor="middle" font-size="22">×2</text><circle class="p0" cx="570" cy="120" r="15"/><text x="445" y="342" text-anchor="middle" font-size="21" fill="#b15a2b">Điểm lớp 1 nằm trên bao lồi lớp 0</text>
</svg>
