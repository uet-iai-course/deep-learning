<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Bốn mốc kỹ thuật dẫn tới học sâu</title><desc id="desc">Năm 1943 hình thức hóa đơn vị tính toán, 1949 đề xuất quy tắc học Hebb, 1969 làm rõ giới hạn tách tuyến tính của perceptron, và 2012 mạng sâu tận dụng dữ liệu cùng GPU.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial,sans-serif}.year{font-size:25px;font-weight:700;fill:#2f3e7a}.label{font-size:19px}.dot{fill:#b15a2b}</style>
  <line x1="75" y1="150" x2="940" y2="150" stroke="#2f3e7a" stroke-width="5" marker-end="url(#a)"/>
  <g text-anchor="middle"><circle class="dot" cx="150" cy="150" r="16"/><text class="year" x="150" y="85">1943</text><text class="label" x="150" y="205">Đơn vị tính toán</text><text class="label" x="150" y="232">có trọng số</text><circle class="dot" cx="375" cy="150" r="16"/><text class="year" x="375" y="85">1949</text><text class="label" x="375" y="205">Liên kết có thể</text><text class="label" x="375" y="232">thay đổi khi học</text><circle class="dot" cx="600" cy="150" r="16"/><text class="year" x="600" y="85">1969</text><text class="label" x="600" y="205">Giới hạn tách</text><text class="label" x="600" y="232">tuyến tính</text><circle class="dot" cx="825" cy="150" r="16"/><text class="year" x="825" y="85">2012</text><text class="label" x="825" y="205">Dữ liệu + GPU</text><text class="label" x="825" y="232">cho mạng sâu</text></g>
  <text x="500" y="305" text-anchor="middle" font-size="18" fill="#555">McCulloch–Pitts · Hebb · Perceptrons · AlexNet</text>
</svg>
