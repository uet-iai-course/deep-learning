<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-labelledby="title desc"><title id="title">Chuỗi biểu diễn trong mạng sâu</title><desc id="desc">Đầu vào đi qua ba tầng, lần lượt tạo đặc trưng cục bộ, tổ hợp đặc trưng và biểu diễn phục vụ dự đoán.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial}.b{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}.l{stroke:#2f3e7a;stroke-width:3;marker-end:url(#a)}</style><g class="b"><rect x="25" y="105" width="150" height="95" rx="12"/><rect x="230" y="85" width="170" height="135" rx="12"/><rect x="455" y="65" width="180" height="175" rx="12"/><rect x="690" y="45" width="210" height="215" rx="12"/></g><g class="l"><line x1="175" y1="152" x2="215" y2="152"/><line x1="400" y1="152" x2="440" y2="152"/><line x1="635" y1="152" x2="675" y2="152"/></g><g text-anchor="middle"><text x="100" y="145" font-size="22" font-weight="700">Đầu vào</text><text x="100" y="175" font-size="18">x</text><text x="315" y="130" font-size="22" font-weight="700">Tầng 1</text><text x="315" y="165" font-size="18">mẫu cục bộ</text><text x="545" y="115" font-size="22" font-weight="700">Tầng 2</text><text x="545" y="155" font-size="18">tổ hợp đặc trưng</text><text x="795" y="100" font-size="22" font-weight="700">Tầng sâu</text><text x="795" y="145" font-size="18">biểu diễn phục vụ</text><text x="795" y="175" font-size="18">dự đoán</text></g></svg>
