<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Lập trình bằng quy tắc và học từ dữ liệu</title><desc id="desc">Hai luồng đối chiếu: chuyên gia viết quy tắc để xử lý đầu vào; dữ liệu có nhãn cùng thuật toán học tạo mô hình rồi mô hình xử lý đầu vào mới.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial,sans-serif}.b{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.c{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}.l{stroke:#2f3e7a;stroke-width:3;marker-end:url(#a)}</style><text x="25" y="55" font-size="26" font-weight="700">Quy tắc</text><rect class="b" x="160" y="18" width="170" height="65" rx="10"/><text x="245" y="58" text-anchor="middle" font-size="22">Chuyên gia</text><line class="l" x1="330" y1="50" x2="425" y2="50"/><rect class="b" x="440" y="18" width="170" height="65" rx="10"/><text x="525" y="58" text-anchor="middle" font-size="22">Chương trình</text><line class="l" x1="610" y1="50" x2="705" y2="50"/><rect class="b" x="720" y="18" width="200" height="65" rx="10"/><text x="820" y="58" text-anchor="middle" font-size="22">Đầu ra</text><text x="25" y="200" font-size="26" font-weight="700">Học từ dữ liệu</text><rect class="c" x="160" y="135" width="170" height="65" rx="10"/><text x="245" y="175" text-anchor="middle" font-size="22">Dữ liệu + nhãn</text><line class="l" x1="330" y1="168" x2="425" y2="168"/><rect class="c" x="440" y="135" width="170" height="65" rx="10"/><text x="525" y="175" text-anchor="middle" font-size="22">Thuật toán học</text><line class="l" x1="610" y1="168" x2="705" y2="168"/><rect class="c" x="720" y="135" width="200" height="65" rx="10"/><text x="820" y="175" text-anchor="middle" font-size="22">Mô hình fθ</text><rect class="c" x="160" y="270" width="170" height="65" rx="10"/><text x="245" y="310" text-anchor="middle" font-size="22">Đầu vào mới</text><line class="l" x1="330" y1="303" x2="705" y2="303"/><rect class="c" x="720" y="270" width="200" height="65" rx="10"/><text x="820" y="310" text-anchor="middle" font-size="22">Dự đoán</text><line class="l" x1="820" y1="200" x2="820" y2="255"/></svg>
