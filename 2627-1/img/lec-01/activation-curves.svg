<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Đồ thị ReLU, sigmoid và tanh</title><desc id="desc">Ba hệ trục cho thấy ReLU có miền giá trị không âm, sigmoid nằm giữa 0 và 1, tanh nằm giữa âm 1 và 1.</desc><style>text{font-family:Arial}.ax{stroke:#555;stroke-width:2}.relu{stroke:#b15a2b;stroke-width:5;fill:none}.sig{stroke:#2f3e7a;stroke-width:5;fill:none}.tanh{stroke:#2e7d32;stroke-width:5;fill:none}</style><g transform="translate(0,0)"><text x="160" y="30" text-anchor="middle" font-size="24" font-weight="700">ReLU</text><line class="ax" x1="45" y1="255" x2="280" y2="255"/><line class="ax" x1="160" y1="300" x2="160" y2="60"/><path class="relu" d="M55 255H160L270 80"/><text x="160" y="325" text-anchor="middle" font-size="18">[0, ∞)</text></g><g transform="translate(320,0)"><text x="160" y="30" text-anchor="middle" font-size="24" font-weight="700">sigmoid</text><line class="ax" x1="45" y1="255" x2="280" y2="255"/><line class="ax" x1="160" y1="300" x2="160" y2="60"/><path class="sig" d="M55 235C105 232 120 205 145 175C175 137 195 92 270 88"/><text x="160" y="325" text-anchor="middle" font-size="18">(0, 1)</text></g><g transform="translate(640,0)"><text x="160" y="30" text-anchor="middle" font-size="24" font-weight="700">tanh</text><line class="ax" x1="45" y1="180" x2="280" y2="180"/><line class="ax" x1="160" y1="300" x2="160" y2="60"/><path class="tanh" d="M55 270C105 268 125 235 150 190C175 145 195 95 270 88"/><text x="160" y="325" text-anchor="middle" font-size="18">(-1, 1)</text></g></svg>
