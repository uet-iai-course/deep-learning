<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Mạng ReLU 2-2-1 giải XOR</title><desc id="desc">Hai đầu vào nối đến hai đơn vị ẩn h1 bằng ReLU của x1 cộng x2 và h2 bằng ReLU của x1 cộng x2 trừ 1; đầu ra dùng sigmoid của h1 trừ 2h2 trừ 0.5.</desc>
  <style>.e{stroke:#90a4ae;stroke-width:3}.x{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.h{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}.y{fill:#e8f5e9;stroke:#2e7d32;stroke-width:3}text{font-family:Arial}</style><g class="e"><path d="M180 140L470 120M180 140L470 290M180 300L470 120M180 300L470 290M470 120L780 215M470 290L780 215"/></g><g class="x"><circle cx="180" cy="140" r="38"/><circle cx="180" cy="300" r="38"/></g><g class="h"><circle cx="470" cy="120" r="52"/><circle cx="470" cy="290" r="52"/></g><circle class="y" cx="780" cy="215" r="55"/><g text-anchor="middle"><text x="180" y="147" font-size="24">x₁</text><text x="180" y="307" font-size="24">x₂</text><text x="470" y="113" font-size="21">h₁</text><text x="470" y="140" font-size="17">ReLU(s)</text><text x="470" y="283" font-size="21">h₂</text><text x="470" y="310" font-size="17">ReLU(s−1)</text><text x="780" y="208" font-size="21">p</text><text x="780" y="237" font-size="17">σ(h₁−2h₂−0.5)</text></g><text x="625" y="90" text-anchor="middle" font-size="20">+1</text><text x="625" y="335" text-anchor="middle" font-size="20">−2</text><text x="490" y="405" text-anchor="middle" font-size="22">s = x₁ + x₂</text>
</svg>
