<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-labelledby="title desc"><title id="title">Hai phép affine rút thành một phép affine</title><desc id="desc">Chuỗi x sang xW1 cộng b1 rồi sang hW2 cộng b2 được rút gọn thành x nhân W1W2 cộng b1W2 cộng b2.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial}.b{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}.l{stroke:#2f3e7a;stroke-width:3;marker-end:url(#a)}</style><rect class="b" x="45" y="45" width="190" height="75" rx="10"/><text x="140" y="91" text-anchor="middle" font-size="24">x</text><line class="l" x1="235" y1="82" x2="345" y2="82"/><rect class="b" x="360" y="45" width="220" height="75" rx="10"/><text x="470" y="91" text-anchor="middle" font-size="22">h = xW₁ + b₁</text><line class="l" x1="580" y1="82" x2="690" y2="82"/><rect class="b" x="705" y="45" width="190" height="75" rx="10"/><text x="800" y="91" text-anchor="middle" font-size="24">y</text><path d="M140 135V235H800V135" fill="none" stroke="#b15a2b" stroke-width="5" marker-end="url(#a)"/><rect x="270" y="190" width="400" height="95" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="470" y="228" text-anchor="middle" font-size="24">y = x(W₁W₂)</text><text x="470" y="260" text-anchor="middle" font-size="24">+ (b₁W₂ + b₂)</text></svg>
