<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">So sánh kết nối đầy đủ và tích chập</title><desc id="d">Bên trái mọi điểm ảnh nối tới một đơn vị; bên phải một cửa sổ nhỏ nối cục bộ và trượt trên ảnh.</desc><rect width="1000" height="340" fill="#fff"/><g font-family="Arial" text-anchor="middle" fill="#26345f"><text x="250" y="35" font-size="24">Kết nối đầy đủ</text><text x="750" y="35" font-size="24">Tích chập</text></g><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="70" y="70" width="250" height="220"/><rect x="570" y="70" width="250" height="220"/><circle cx="430" cy="180" r="34"/><circle cx="930" cy="180" r="34"/></g><g stroke="#b15a2b" stroke-width="3"><path d="M90 90L430 180M300 90L430 180M90 270L430 180M300 270L430 180"/><path d="M650 130L930 180M740 130L930 180M650 220L930 180M740 220L930 180"/></g><rect x="635" y="115" width="120" height="120" fill="none" stroke="#376c4a" stroke-width="7"/></svg>
