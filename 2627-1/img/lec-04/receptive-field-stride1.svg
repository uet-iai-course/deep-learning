<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Trường tiếp nhận tăng qua các tầng có bước trượt một</title><desc id="d">Ba ô minh họa vùng ba, năm và bảy trên đầu vào cho một, hai và ba tầng dùng nhân ba.</desc><rect width="1000" height="320" fill="#fff"/><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="50" y="50" width="250" height="220"/><rect x="375" y="50" width="250" height="220"/><rect x="700" y="50" width="250" height="220"/></g><g fill="none" stroke="#b15a2b" stroke-width="7"><rect x="120" y="100" width="110" height="110"/><rect x="425" y="80" width="150" height="150"/><rect x="725" y="60" width="200" height="200"/></g><g font-family="Arial" font-size="24" fill="#26345f" text-anchor="middle"><text x="175" y="300">3 × 3</text><text x="500" y="300">5 × 5</text><text x="825" y="300">7 × 7</text></g></svg>
