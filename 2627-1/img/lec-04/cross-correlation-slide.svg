<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Cửa sổ tương quan chéo trượt trên đầu vào</title><desc id="d">Nhân hai nhân hai giữ nguyên hướng, lần lượt chồng lên các cửa sổ đầu vào để tạo các ô đầu ra.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="320" fill="#fff"/><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="60" y="45" width="300" height="230"/><rect x="450" y="90" width="140" height="140"/><rect x="710" y="70" width="220" height="180"/></g><rect x="90" y="75" width="140" height="140" fill="none" stroke="#b15a2b" stroke-width="7"/><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M365 160H445"/><path d="M595 160H705"/></g><g font-family="Arial" font-size="24" fill="#26345f" text-anchor="middle"><text x="210" y="305">đầu vào và cửa sổ</text><text x="520" y="260">nhân không lật</text><text x="820" y="280">đầu ra</text></g></svg>
