<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Cục bộ và chia sẻ trọng số</title><desc id="d">Ba cửa sổ cùng kích thước ở ba vị trí dùng cùng một bộ trọng số để tạo ba đầu ra.</desc><rect width="1000" height="330" fill="#fff"/><rect x="70" y="55" width="500" height="230" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><g fill="none" stroke="#b15a2b" stroke-width="7"><rect x="100" y="85" width="120" height="120"/><rect x="260" y="110" width="120" height="120"/><rect x="420" y="135" width="120" height="120"/></g><g font-family="Arial" font-size="21" fill="#26345f" text-anchor="middle"><text x="160" y="235">cùng W</text><text x="320" y="260">cùng W</text><text x="480" y="285">cùng W</text><text x="790" y="110">cục bộ: cửa sổ nhỏ</text><text x="790" y="165">chia sẻ: cùng W</text><text x="790" y="220">đầu ra: bản đồ đặc trưng</text></g></svg>
