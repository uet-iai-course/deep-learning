<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Tổng tương quan chéo qua nhiều kênh</title><desc id="d">Ba kênh đầu vào đi qua ba lát nhân tương ứng; ba kết quả được cộng với độ lệch để tạo một kênh đầu ra.</desc><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="330" fill="#fff"/><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="50" y="45" width="180" height="70"/><rect x="50" y="130" width="180" height="70"/><rect x="50" y="215" width="180" height="70"/><rect x="330" y="45" width="150" height="70"/><rect x="330" y="130" width="150" height="70"/><rect x="330" y="215" width="150" height="70"/><circle cx="650" cy="165" r="50"/><rect x="800" y="115" width="150" height="100"/></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#m)"><path d="M230 80H330M230 165H330M230 250H330M480 80L615 145M480 165H595M480 250L615 185M700 165H800"/></g><g font-family="Arial" fill="#26345f" font-size="24" text-anchor="middle"><text x="140" y="315">kênh vào</text><text x="405" y="315">lát nhân</text><text x="650" y="172">cộng + độ lệch</text><text x="875" y="245">một kênh ra</text></g></svg>
