<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Quy ước trục NCHW và OIHW</title><desc id="d">Bốn khối đầu vào lần lượt là lô, kênh, chiều cao, chiều rộng; bốn khối trọng số là kênh ra, kênh vào, chiều cao nhân, chiều rộng nhân.</desc><rect width="1000" height="300" fill="#fff"/><g font-family="Arial" text-anchor="middle" font-size="25"><text x="250" y="45" fill="#26345f">Đầu vào X: N C H W</text><text x="750" y="45" fill="#26345f">Trọng số W: O I H W</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="55" y="95" width="90" height="90"/><rect x="155" y="95" width="90" height="90"/><rect x="255" y="95" width="90" height="90"/><rect x="355" y="95" width="90" height="90"/><rect x="555" y="95" width="90" height="90"/><rect x="655" y="95" width="90" height="90"/><rect x="755" y="95" width="90" height="90"/><rect x="855" y="95" width="90" height="90"/></g><g fill="#26345f"><text x="100" y="150">N</text><text x="200" y="150">C</text><text x="300" y="150">H</text><text x="400" y="150">W</text><text x="600" y="150">O</text><text x="700" y="150">I</text><text x="800" y="150">H</text><text x="900" y="150">W</text></g></g></svg>
