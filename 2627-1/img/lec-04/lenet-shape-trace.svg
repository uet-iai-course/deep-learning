<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Dấu vết kích thước của một mạng tích chập nhỏ</title><desc id="d">Chuỗi đầu vào một kênh 28 nhân 28, tích chập sáu kênh, gộp, tích chập mười sáu kênh, gộp, làm phẳng và ba tầng đầy đủ.</desc><rect width="1100" height="300" fill="#fff"/><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"><rect x="20" y="90" width="110" height="90"/><rect x="150" y="75" width="120" height="120"/><rect x="290" y="90" width="100" height="90"/><rect x="410" y="65" width="120" height="140"/><rect x="550" y="90" width="100" height="90"/><rect x="670" y="100" width="100" height="70"/><rect x="790" y="100" width="90" height="70"/><rect x="900" y="100" width="80" height="70"/><rect x="1000" y="100" width="70" height="70"/></g><g font-family="Arial" fill="#26345f" font-size="22" text-anchor="middle"><text x="75" y="125">1×28×28</text><text x="210" y="125">6×28×28</text><text x="340" y="125">6×14×14</text><text x="470" y="125">16×10×10</text><text x="600" y="125">16×5×5</text><text x="720" y="125">400</text><text x="835" y="125">120</text><text x="940" y="125">84</text><text x="1035" y="125">10</text><text x="210" y="230">tích chập 5</text><text x="340" y="230">gộp 2</text><text x="470" y="230">tích chập 5</text><text x="600" y="230">gộp 2</text></g></svg>
