<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Cửa sổ gộp hai nhân hai</title><desc id="d">Bốn cửa sổ không chồng lấn trên ma trận bốn nhân bốn tạo ma trận đầu ra hai nhân hai; mỗi kênh xử lý riêng.</desc><rect width="1000" height="330" fill="#fff"/><rect x="70" y="35" width="300" height="260" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><g fill="none" stroke="#b15a2b" stroke-width="6"><rect x="70" y="35" width="150" height="130"/><rect x="220" y="35" width="150" height="130"/><rect x="70" y="165" width="150" height="130"/><rect x="220" y="165" width="150" height="130"/></g><rect x="650" y="75" width="240" height="180" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><path d="M420 165H610" stroke="#2f3e7a" stroke-width="5"/><g font-family="Arial" fill="#26345f" font-size="22" text-anchor="middle"><text x="220" y="325">đầu vào 4 × 4</text><text x="770" y="285">đầu ra 2 × 2</text><text x="515" y="145">cực đại</text><text x="515" y="185">hoặc trung bình</text></g></svg>
