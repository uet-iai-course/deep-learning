<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Tương đương dịch chuyển</title><desc id="d">Dịch đầu vào một ô dẫn đến bản đồ đặc trưng dịch tương ứng khi cửa sổ hợp lệ và bước trượt một; biên được đánh dấu là ngoại lệ.</desc><rect width="1000" height="330" fill="#fff"/><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="60" y="55" width="220" height="200"/><rect x="390" y="55" width="220" height="200"/><rect x="720" y="55" width="220" height="200"/></g><g fill="#b15a2b"><circle cx="130" cy="130" r="20"/><circle cx="475" cy="130" r="20"/><circle cx="805" cy="130" r="20"/></g><g font-family="Arial" fill="#26345f" font-size="24" text-anchor="middle"><text x="170" y="285">đầu vào</text><text x="500" y="285">dịch đầu vào</text><text x="830" y="285">đầu ra dịch theo</text><text x="500" y="30">bước trượt 1; cùng quy tắc biên</text></g></svg>
