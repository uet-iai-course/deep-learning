<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Truy hồi trường tiếp nhận và khoảng nhảy</title><desc id="d">Mỗi tầng nhận trường tiếp nhận và khoảng nhảy trước, mở rộng theo kích thước nhân rồi nhân khoảng nhảy với bước trượt.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="300" fill="#fff"/><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="70" y="90" width="180" height="100"/><rect x="410" y="90" width="180" height="100"/><rect x="750" y="90" width="180" height="100"/></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M250 140H410M590 140H750"/></g><g font-family="Arial" fill="#26345f" font-size="24" text-anchor="middle"><text x="160" y="130">r trước, j trước</text><text x="160" y="160">khởi tạo 1, 1</text><text x="500" y="130">mở rộng theo K</text><text x="500" y="160">nhảy theo S</text><text x="840" y="130">r mới, j mới</text><text x="840" y="160">truyền tầng sau</text></g></svg>
