<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Vùng đệm và bước trượt</title><desc id="d">Đầu vào có vùng đệm; các vị trí cửa sổ cách nhau hai ô minh họa bước trượt hai.</desc><rect width="1000" height="330" fill="#fff"/><rect x="80" y="35" width="360" height="260" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><rect x="120" y="75" width="280" height="180" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><g fill="none" stroke="#376c4a" stroke-width="6"><rect x="90" y="45" width="120" height="120"/><rect x="210" y="45" width="120" height="120"/><rect x="90" y="165" width="120" height="120"/><rect x="210" y="165" width="120" height="120"/></g><g font-family="Arial" font-size="24" fill="#26345f"><text x="520" y="105">viền: vùng đệm</text><text x="520" y="165">khoảng dịch cửa sổ: bước trượt</text><text x="520" y="225">chỉ vị trí cửa sổ hợp lệ tạo đầu ra</text></g></svg>
