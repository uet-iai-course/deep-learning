<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-labelledby="title desc"><title id="title">Ví dụ vô hướng ba bước lan truyền xuôi</title><desc id="desc">Ba đầu vào một, không, trừ một đi qua trạng thái h một, h hai, h ba; đầu ra cuối o ba được so với mục tiêu 0 phẩy 4.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2f3e7a"/></marker></defs><rect width="1160" height="350" fill="#fff"/><g font-family="Arial" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="40" y="130" width="150" height="85" rx="10"/><rect x="270" y="130" width="180" height="85" rx="10"/><rect x="530" y="130" width="180" height="85" rx="10"/><rect x="790" y="130" width="180" height="85" rx="10"/></g><g font-size="24" fill="#263238"><text x="115" y="165">h₀=0</text><text x="115" y="195">x₁=1</text><text x="360" y="165">h₁=0.4621</text><text x="360" y="195">x₂=0</text><text x="620" y="165">h₂=0.3537</text><text x="620" y="195">x₃=−1</text><text x="880" y="165">h₃=−0.2137</text><text x="880" y="195">o₃=−0.2564</text></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M190 172h70"/><path d="M450 172h70"/><path d="M710 172h70"/><path d="M970 172h130"/></g><text x="1090" y="148" font-size="23" fill="#263238">y=0.4</text><text x="1090" y="195" font-size="23" fill="#b15a2b">L=0.2154</text><text x="580" y="285" font-size="23" fill="#555">wₓ=0.5, wₕ=0.8, wᵧ=1.2; tanh; không độ lệch</text></g></svg>
