<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 350" role="img" aria-labelledby="title desc"><title id="title">Đạo hàm trực tiếp và đạo hàm toàn phần</title><desc id="desc">Nhánh trực tiếp từ w h đến h ba bỏ qua ảnh hưởng của w h qua h hai; đạo hàm toàn phần gồm cả hai đường.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2f3e7a"/></marker></defs><rect width="1130" height="350" fill="#fff"/><g font-family="Arial" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="70" y="130" width="150" height="80" rx="10"/><rect x="390" y="55" width="150" height="80" rx="10"/><rect x="390" y="225" width="150" height="80" rx="10"/><rect x="750" y="130" width="150" height="80" rx="10"/><rect x="980" y="130" width="110" height="80" rx="10"/></g><g font-size="24" fill="#263238"><text x="145" y="178">wₕ</text><text x="465" y="103">h₂</text><text x="465" y="273">nhánh trực tiếp</text><text x="825" y="178">h₃</text><text x="1035" y="178">L</text></g><g fill="none" stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M220 155L380 100"/><path d="M220 188L380 263"/><path d="M540 95L740 155"/><path d="M540 265L740 190"/><path d="M900 170h70"/></g><g font-size="22"><text x="565" y="45" fill="#2f3e7a">ảnh hưởng qua trạng thái trước</text><text x="565" y="330" fill="#b15a2b">giữ h₂ cố định</text></g></g></svg>
