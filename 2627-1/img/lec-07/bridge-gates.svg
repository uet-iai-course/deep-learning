<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc"><title id="title">Cầu nối từ RNN cơ bản sang kiến trúc có cổng</title><desc id="desc">Đường gradient dài của RNN cơ bản dẫn đến câu hỏi thiết kế một đường trạng thái có khả năng kiểm soát việc giữ và bỏ thông tin.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2f3e7a"/></marker></defs><rect width="1120" height="330" fill="#fff"/><g font-family="Arial" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="70" y="105" width="250" height="110" rx="12"/><rect x="435" y="105" width="250" height="110" rx="12"/><rect x="800" y="105" width="250" height="110" rx="12"/></g><g font-size="24" fill="#263238"><text x="195" y="150">tích Jacobian dài</text><text x="195" y="185">khó giữ gradient</text><text x="560" y="150">cần kiểm soát</text><text x="560" y="185">giữ và quên</text><text x="925" y="150">kiến trúc có cổng</text><text x="925" y="185">ở bài kế tiếp</text></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M320 160h105"/><path d="M685 160h105"/></g></g></svg>
