<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" role="img" aria-labelledby="title desc"><title id="title">Bốn dạng ánh xạ đầu vào và đầu ra</title><desc id="desc">Bốn sơ đồ một sang một, một sang nhiều, nhiều sang một và nhiều sang nhiều, phân biệt đầu vào x và đầu ra y bằng nhãn và hình dạng.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2f3e7a"/></marker></defs><rect width="1180" height="390" fill="#fff"/><g font-family="Arial" text-anchor="middle"><g font-size="23" fill="#263238"><text x="145" y="45">Một → một</text><text x="440" y="45">Một → nhiều</text><text x="735" y="45">Nhiều → một</text><text x="1030" y="45">Nhiều → nhiều</text></g><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="90" y="210" width="110" height="55" rx="8"/><rect x="90" y="90" width="110" height="55" rx="8"/><rect x="385" y="250" width="110" height="55" rx="8"/><rect x="335" y="90" width="70" height="55" rx="8"/><rect x="415" y="90" width="70" height="55" rx="8"/><rect x="495" y="90" width="70" height="55" rx="8"/><rect x="630" y="250" width="70" height="55" rx="8"/><rect x="710" y="250" width="70" height="55" rx="8"/><rect x="790" y="250" width="70" height="55" rx="8"/><rect x="680" y="90" width="110" height="55" rx="8"/><rect x="925" y="250" width="70" height="55" rx="8"/><rect x="1005" y="250" width="70" height="55" rx="8"/><rect x="1085" y="250" width="70" height="55" rx="8"/><rect x="925" y="90" width="70" height="55" rx="8"/><rect x="1005" y="90" width="70" height="55" rx="8"/><rect x="1085" y="90" width="70" height="55" rx="8"/></g><g font-size="22" fill="#263238"><text x="145" y="245">x</text><text x="145" y="125">y</text><text x="440" y="285">x</text><text x="370" y="125">y₁</text><text x="450" y="125">y₂</text><text x="530" y="125">y₃</text><text x="665" y="285">x₁</text><text x="745" y="285">x₂</text><text x="825" y="285">x₃</text><text x="735" y="125">y</text><text x="960" y="285">x₁</text><text x="1040" y="285">x₂</text><text x="1120" y="285">x₃</text><text x="960" y="125">y₁</text><text x="1040" y="125">y₂</text><text x="1120" y="125">y₃</text></g><g stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M145 205v-50"/><path d="M440 245V160"/><path d="M745 245V155"/><path d="M960 245v-90"/><path d="M1040 245v-90"/><path d="M1120 245v-90"/></g><g font-size="22" fill="#555"><text x="145" y="350">phân loại cố định</text><text x="440" y="350">sinh chuỗi</text><text x="735" y="350">phân loại chuỗi</text><text x="1030" y="350">gán nhãn từng bước</text></g></g></svg>
