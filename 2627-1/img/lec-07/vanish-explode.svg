<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc"><title id="title">So sánh gradient triệt tiêu và bùng nổ</title><desc id="desc">Hai đường cùng bắt đầu ở độ lớn một: hệ số 0 phẩy 8 giảm về gần không, hệ số 1 phẩy 2 tăng nhanh; nhãn và kiểu nét phân biệt hai đường.</desc><rect width="1120" height="370" fill="#fff"/><g font-family="Arial"><path d="M100 300H1040M100 300V45" stroke="#263238" stroke-width="3"/><g font-size="22" fill="#263238"><text x="1030" y="340">số bước k</text><text x="25" y="55">độ lớn</text><text x="85" y="307">0</text><text x="300" y="330">5</text><text x="520" y="330">10</text><text x="740" y="330">15</text><text x="960" y="330">20</text></g><path d="M100 250C350 265 600 282 1000 295" fill="none" stroke="#b15a2b" stroke-width="5"/><path d="M100 250C400 245 640 205 800 130S960 50 1000 45" fill="none" stroke="#2f3e7a" stroke-width="5" stroke-dasharray="12 8"/><g font-size="23"><text x="740" y="275" fill="#b15a2b">0.8ᵏ → 0</text><text x="790" y="95" fill="#2f3e7a">1.2ᵏ tăng</text></g><g font-size="22" fill="#555"><text x="210" y="55">nét liền: triệt tiêu</text><text x="210" y="85">nét đứt: bùng nổ</text></g></g></svg>
