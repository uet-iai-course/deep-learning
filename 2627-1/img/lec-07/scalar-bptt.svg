<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc"><title id="title">Lan truyền ngược qua ví dụ vô hướng ba bước</title><desc id="desc">Gradient trạng thái truyền từ bước ba về bước một với các delta âm, rồi cộng đóng góp tham số tại mỗi thời điểm.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#b15a2b"/></marker></defs><rect width="1160" height="360" fill="#fff"/><g font-family="Arial" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="90" y="125" width="190" height="90" rx="10"/><rect x="410" y="125" width="190" height="90" rx="10"/><rect x="730" y="125" width="190" height="90" rx="10"/></g><g font-size="24" fill="#263238"><text x="185" y="163">bước 1</text><text x="185" y="195">δ₁=−0,3310</text><text x="505" y="163">bước 2</text><text x="505" y="195">δ₂=−0,5261</text><text x="825" y="163">bước 3</text><text x="825" y="195">δ₃=−0,7517</text></g><g stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"><path d="M720 170H610"/><path d="M400 170H290"/></g><text x="1015" y="150" font-size="23" fill="#b15a2b">∂L/∂o₃</text><path d="M1000 170H930" stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"/><text x="580" y="295" font-size="23" fill="#555">∂L/∂wₕ = Σₜ δₜhₜ₋₁ = −0,5090</text></g></svg>
