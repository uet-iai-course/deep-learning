<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc"><title id="title">Tham số được dùng chung qua thời gian</title><desc id="desc">Một hộp tham số W h nối đến ba bước thời gian, nên gradient W h là tổng đóng góp của cả ba lần sử dụng.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2f3e7a"/></marker></defs><rect width="1120" height="330" fill="#fff"/><g font-family="Arial" text-anchor="middle"><rect x="455" y="35" width="210" height="75" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="560" y="82" font-size="25" fill="#263238">một Wₕ</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="125" y="205" width="180" height="80" rx="10"/><rect x="470" y="205" width="180" height="80" rx="10"/><rect x="815" y="205" width="180" height="80" rx="10"/></g><g font-size="24" fill="#263238"><text x="215" y="253">bước 1</text><text x="560" y="253">bước 2</text><text x="905" y="253">bước 3</text></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M500 110L270 195"/><path d="M560 110v85"/><path d="M620 110L850 195"/></g><text x="560" y="320" font-size="22" fill="#555">∂L/∂Wₕ cộng ba đóng góp</text></g></svg>
