<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc"><title id="title">Bộ nhớ của BPTT tăng theo độ dài chuỗi</title><desc id="desc">Các trạng thái và tiền kích hoạt từ T bước được lưu trong lan truyền xuôi để dùng lại khi lan truyền ngược.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2f3e7a"/></marker></defs><rect width="1120" height="340" fill="#fff"/><g font-family="Arial" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="70" y="120" width="220" height="90" rx="10"/><rect x="450" y="120" width="220" height="90" rx="10"/><rect x="830" y="120" width="220" height="90" rx="10"/></g><g font-size="24" fill="#263238"><text x="180" y="157">lan truyền xuôi</text><text x="180" y="188">qua T bước</text><text x="560" y="157">lưu Hₜ, Aₜ</text><text x="560" y="188">cho t=1…T</text><text x="940" y="157">lan truyền ngược</text><text x="940" y="188">từ T về 1</text></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M290 165h150"/><path d="M670 165h150"/></g><text x="560" y="285" font-size="23" fill="#555">bộ nhớ kích hoạt tăng xấp xỉ theo T·N·Dₕ</text></g></svg>
