<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 360" role="img" aria-labelledby="title desc">
  <title id="title">RNN được trải qua ba bước thời gian</title>
  <desc id="desc">Một ô RNN có vòng cập nhật trạng thái ở bên trái tương đương ba lần dùng chung tham số ở bên phải.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2f3e7a"/></marker></defs>
  <rect width="1140" height="360" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="80" y="130" width="150" height="90" rx="12"/><rect x="420" y="130" width="150" height="90" rx="12"/><rect x="650" y="130" width="150" height="90" rx="12"/><rect x="880" y="130" width="150" height="90" rx="12"/></g>
    <g font-size="25" fill="#263238"><text x="155" y="185">ô RNN</text><text x="495" y="185">h₁</text><text x="725" y="185">h₂</text><text x="955" y="185">h₃</text></g>
    <g stroke="#2f3e7a" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M230 175c90 0 90-120 0-120-70 0-70 55-30 72"/><path d="M330 175h80"/><path d="M570 175h70"/><path d="M800 175h70"/><path d="M495 300v-70"/><path d="M725 300v-70"/><path d="M955 300v-70"/></g>
    <g font-size="23" fill="#555"><text x="155" y="275">một quan hệ truy hồi</text><text x="285" y="162">trải theo thời gian</text><text x="495" y="330">x₁</text><text x="725" y="330">x₂</text><text x="955" y="330">x₃</text><text x="725" y="90">cùng Wₓ, Wₕ, bₕ</text></g>
  </g>
</svg>
