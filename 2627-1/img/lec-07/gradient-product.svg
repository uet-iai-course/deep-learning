<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 330" role="img" aria-labelledby="title desc"><title id="title">Gradient qua nhiều bước là tích Jacobian</title><desc id="desc">Gradient từ h T truyền ngược qua các Jacobian J T, J T trừ một cho đến J t cộng một để đến h t.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#b15a2b"/></marker></defs><rect width="1140" height="330" fill="#fff"/><g font-family="Arial" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="80" y="120" width="150" height="80" rx="10"/><rect x="350" y="120" width="150" height="80" rx="10"/><rect x="640" y="120" width="150" height="80" rx="10"/><rect x="910" y="120" width="150" height="80" rx="10"/></g><g font-size="25" fill="#263238"><text x="155" y="168">hₜ</text><text x="425" y="168">hₜ₊₁</text><text x="715" y="168">…</text><text x="985" y="168">h_T</text></g><g stroke="#2f3e7a" stroke-width="4"><path d="M230 160h110"/><path d="M500 160h130"/><path d="M790 160h110"/></g><g stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"><path d="M900 205H795"/><path d="M630 205H505"/><path d="M340 205H235"/></g><g font-size="22" fill="#b15a2b"><text x="850" y="245">J_T</text><text x="565" y="245">…</text><text x="285" y="245">Jₜ₊₁</text></g><text x="570" y="305" font-size="23" fill="#555">độ lớn phụ thuộc tích nhiều biến đổi cục bộ</text></g></svg>
