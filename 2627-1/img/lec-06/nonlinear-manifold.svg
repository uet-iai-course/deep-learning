<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 330" role="img" aria-labelledby="t d"><title id="t">Biểu diễn phi tuyến cho dữ liệu trên đường cong</title><desc id="d">Dữ liệu trong không gian hai chiều nằm gần một đường cong; bộ mã hóa phi tuyến ánh xạ vị trí dọc đường cong thành một mã một chiều.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2f3e7a"/></marker></defs><rect width="1050" height="330" fill="#fff"/><g font-family="Arial"><path d="M80 255C170 40 350 60 440 230S650 285 730 105" fill="none" stroke="#2f3e7a" stroke-width="12"/><g fill="#f7efe6" stroke="#b15a2b" stroke-width="3"><circle cx="125" cy="175" r="10"/><circle cx="220" cy="85" r="10"/><circle cx="330" cy="120" r="10"/><circle cx="420" cy="220" r="10"/><circle cx="540" cy="265" r="10"/><circle cx="650" cy="210" r="10"/><circle cx="715" cy="125" r="10"/></g><path d="M750 165h95" stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"/><path d="M855 100v130" stroke="#2f3e7a" stroke-width="5"/><g fill="#b15a2b"><circle cx="855" cy="115" r="9"/><circle cx="855" cy="135" r="9"/><circle cx="855" cy="155" r="9"/><circle cx="855" cy="175" r="9"/><circle cx="855" cy="195" r="9"/><circle cx="855" cy="215" r="9"/></g><g font-size="23" fill="#263238"><text x="300" y="305">dữ liệu gần một đường cong</text><text x="795" y="145">fθ</text><text x="930" y="165">mã z</text><text x="930" y="195">một chiều</text></g></g></svg>
