<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="t d"><title id="t">Tái sử dụng bộ mã hóa cho phân loại</title><desc id="d">Trong tiền huấn luyện, bộ mã hóa nối bộ giải mã; ở tác vụ đích, bỏ bộ giải mã và nối bộ phân loại 10 lớp vào mã z.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2f3e7a"/></marker></defs><rect width="1120" height="330" fill="#fff"/><g font-family="Arial" text-anchor="middle"><text x="125" y="45" font-size="24" fill="#2f3e7a">Tiền huấn luyện</text><text x="125" y="235" font-size="24" fill="#2f3e7a">Tác vụ đích</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="240" y="20" width="180" height="80" rx="10"/><rect x="500" y="20" width="150" height="80" rx="10"/><rect x="730" y="20" width="190" height="80" rx="10"/><rect x="240" y="210" width="180" height="80" rx="10"/><rect x="500" y="210" width="150" height="80" rx="10"/><rect x="730" y="210" width="190" height="80" rx="10"/></g><g font-size="23" fill="#263238"><text x="330" y="68">Bộ mã hóa</text><text x="575" y="68">z: N×d</text><text x="825" y="68">Bộ giải mã</text><text x="330" y="258">Bộ mã hóa</text><text x="575" y="258">z: N×d</text><text x="825" y="248">Bộ phân loại</text><text x="825" y="276">10 lớp</text></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M420 60h70"/><path d="M650 60h70"/><path d="M420 250h70"/><path d="M650 250h70"/></g><path d="M330 105v95" stroke="#b15a2b" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="430" y="163" font-size="22" fill="#b15a2b">tái sử dụng θ</text></g></svg>
