<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="t d"><title id="t">Cùng phép chia dưới hai cách biểu diễn</title><desc id="d">Phép chia 210 cho 6 trong hệ chữ số thập phân được đặt cạnh phép chia CCX cho VI trong chữ số La Mã để cho thấy biểu diễn ảnh hưởng độ dễ của thao tác.</desc><rect width="1040" height="300" fill="#fff"/><g font-family="Arial" text-anchor="middle"><rect x="70" y="65" width="380" height="165" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><rect x="590" y="65" width="380" height="165" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><g fill="#263238"><text x="260" y="125" font-size="34">210 ÷ 6</text><text x="260" y="175" font-size="28">thuật toán quen thuộc</text><text x="780" y="125" font-size="34">CCX ÷ VI</text><text x="780" y="175" font-size="28">cùng giá trị, khó thao tác hơn</text></g></g></svg>
