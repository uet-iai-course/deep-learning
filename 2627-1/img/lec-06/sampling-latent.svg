<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">Mã do dữ liệu tạo và một mã tùy ý</title>
  <desc id="desc">Các mã z mũ n do bộ mã hóa tạo thành hai vùng. Một mã z sao nằm xa các vùng này và không xuất hiện trong các điểm mà mất mát huấn luyện được đánh giá.</desc>
  <rect width="1100" height="340" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <path d="M90 30v250h900" fill="none" stroke="#263238" stroke-width="3"/><text x="940" y="325" text-anchor="end" font-size="22">tọa độ mã 1</text><text x="30" y="160" transform="rotate(-90 30 160)" text-anchor="middle" font-size="22">tọa độ mã 2</text>
    <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><circle cx="300" cy="110" r="12"/><circle cx="345" cy="135" r="12"/><circle cx="280" cy="155" r="12"/><circle cx="360" cy="85" r="12"/><circle cx="735" cy="210" r="12"/><circle cx="790" cy="185" r="12"/><circle cx="815" cy="235" r="12"/><circle cx="755" cy="255" r="12"/></g>
    <path d="M550 135l18 36h-36z" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/>
    <g font-size="23" fill="#263238"><text x="320" y="55">mã từ dữ liệu</text><text x="760" y="145">mã từ dữ liệu</text><text x="585" y="120" fill="#b15a2b">z*</text></g>
    <text x="550" y="305" text-anchor="middle" font-size="22" fill="#555">z* nằm ngoài vùng được dữ liệu huấn luyện hỗ trợ</text>
  </g>
</svg>
