<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Nghiệm sao chép đồng nhất</title><desc id="d">Khi mã có đủ chiều và mô hình đủ khả năng, bộ mã hóa và giải mã có thể cùng sao chép đầu vào mà không học biểu diễn hữu ích.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#b15a2b"/></marker></defs><rect width="1000" height="300" fill="#fff"/><g font-family="Arial" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="55" y="100" width="180" height="95" rx="10"/><rect x="410" y="100" width="180" height="95" rx="10"/><rect x="765" y="100" width="180" height="95" rx="10"/></g><g font-size="25" fill="#263238"><text x="145" y="143">x</text><text x="145" y="175">784 chiều</text><text x="500" y="143">z = x</text><text x="500" y="175">784 chiều</text><text x="855" y="143">x̂ = x</text><text x="855" y="175">SSE = 0</text></g><g stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"><path d="M235 148h165"/><path d="M590 148h165"/></g><g font-size="22" fill="#555"><text x="318" y="125">sao chép</text><text x="673" y="125">sao chép</text></g></g></svg>
