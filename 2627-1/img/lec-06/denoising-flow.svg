<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Luồng autoencoder khử nhiễu</title>
  <desc id="desc">Lô sạch X được làm nhiễu thành X dấu ngã, đưa qua bộ mã hóa và bộ giải mã; mất mát so bản tái tạo X mũ với X sạch.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2f3e7a"/></marker></defs>
  <rect width="1120" height="330" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="25" y="105" width="150" height="90" rx="10"/><rect x="245" y="105" width="170" height="90" rx="10"/><rect x="485" y="105" width="170" height="90" rx="10"/><rect x="725" y="105" width="170" height="90" rx="10"/><rect x="965" y="105" width="130" height="90" rx="10"/></g>
    <g font-size="24" fill="#263238"><text x="100" y="142">X sạch</text><text x="100" y="173">mục tiêu</text><text x="330" y="142">X có nhiễu</text><text x="330" y="173">đầu vào</text><text x="570" y="155">fθ</text><text x="810" y="155">gφ</text><text x="1030" y="145">X</text><text x="1030" y="175">tái tạo</text></g>
    <g stroke="#2f3e7a" stroke-width="4" marker-end="url(#arrow)"><path d="M175 150h60"/><path d="M415 150h60"/><path d="M655 150h60"/><path d="M895 150h60"/></g>
    <g font-size="22" fill="#555"><text x="205" y="85">lấy mẫu từ q</text><text x="450" y="85">mã hóa</text><text x="690" y="85">giải mã</text></g>
    <path d="M100 205v70h930v-70" fill="none" stroke="#b15a2b" stroke-width="4"/><text x="565" y="300" font-size="24" fill="#b15a2b">Mất mát so X tái tạo với X sạch</text>
  </g>
</svg>
