<svg xmlns="http://www.w3.org/2000/svg" width="950" height="330" viewBox="0 0 950 330" role="img" aria-labelledby="t d">
  <title id="t">Ví dụ lan truyền ngược qua max, cộng, nhân và ReLU</title>
  <desc id="d">Ví dụ độc lập: x bằng 4 và y bằng âm 6 đi vào max; z bằng âm 1 và w bằng 2.5 đi vào cộng; hai kết quả nhân nhau rồi qua ReLU cho đầu ra 6. Hình không cho sẵn gradient đầu vào.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#2f3e7a"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#2f3e7a" stroke-width="3">
      <circle cx="60" cy="55" r="35"/><circle cx="60" cy="135" r="35"/><circle cx="60" cy="215" r="35"/><circle cx="60" cy="295" r="30"/>
      <rect x="190" y="65" width="100" height="60" rx="12"/><rect x="190" y="225" width="100" height="60" rx="12"/><rect x="440" y="135" width="90" height="60" rx="12"/><rect x="670" y="135" width="110" height="60" rx="12"/>
    </g>
    <g font-size="21">
      <text x="60" y="62">x=4</text><text x="60" y="142">y=−6</text><text x="60" y="222">z=−1</text><text x="60" y="302">w=2.5</text>
      <text x="240" y="102">max = 4</text><text x="240" y="262">+ = 1.5</text><text x="485" y="172">× = 6</text><text x="725" y="172">ReLU = 6</text>
    </g>
    <g stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)">
      <path d="M95 55L185 80"/><path d="M95 135L185 110"/><path d="M95 215L185 240"/><path d="M90 290L185 270"/><path d="M290 95L435 150"/><path d="M290 255L435 180"/><path d="M530 165H665"/>
    </g>
    <text x="475" y="40" font-size="24" fill="#b15a2b">Hãy tính gradient theo bốn đầu vào</text>
  </g>
</svg>
