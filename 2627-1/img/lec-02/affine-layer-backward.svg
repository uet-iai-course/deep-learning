<svg xmlns="http://www.w3.org/2000/svg" width="930" height="300" viewBox="0 0 930 300" role="img" aria-labelledby="t d"><title id="t">Lan truyền ngược qua tầng afin batch-first</title><desc id="d">Z bằng XW cộng b, gradient GZ tạo GX bằng GZ W chuyển vị, GW bằng X chuyển vị GZ và gb bằng tổng các hàng GZ.</desc><g font-family="sans-serif" text-anchor="middle"><rect x="300" y="25" width="330" height="70" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="465" y="70" font-size="28">Z = XW + b</text><g font-size="22"><rect x="35" y="160" width="250" height="95" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="340" y="160" width="250" height="95" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><rect x="645" y="160" width="250" height="95" rx="14" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3"/><text x="160" y="202">GX = GZ Wᵀ</text><text x="160" y="235">B × d</text><text x="465" y="202">GW = XᵀGZ</text><text x="465" y="235">d × k</text><text x="770" y="202">gb = ∑ᵢ GZᵢ:</text><text x="770" y="235">k</text></g><path d="M465 95V145M465 145L160 160M465 145L770 160" stroke="#2f3e7a" stroke-width="3" fill="none"/></g></svg>
