<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="t d"><title id="t">Cộng gradient từ nhiều nhánh</title><desc id="d">Biến x đi vào hai hàm g1 và g2; các đường gặp nhau tại f nên gradient của x là tổng đóng góp từ hai nhánh.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="sans-serif" font-size="22" text-anchor="middle"><circle cx="90" cy="135" r="42" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><text x="90" y="143">x</text><rect x="260" y="35" width="130" height="60" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><rect x="260" y="175" width="130" height="60" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><rect x="555" y="105" width="130" height="60" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="325" y="73">y₁=g₁(x)</text><text x="325" y="213">y₂=g₂(x)</text><text x="620" y="143">z=f(y₁,y₂)</text><g stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M130 120L250 75"/><path d="M130 150L250 195"/><path d="M390 65L545 120"/><path d="M390 205L545 150"/></g><text x="450" y="255" fill="#b15a2b">∂z/∂x = (∂z/∂y₁)(∂y₁/∂x) + (∂z/∂y₂)(∂y₂/∂x)</text></g></svg>
