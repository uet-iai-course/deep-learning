<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="t d"><title id="t">Kích thước Jacobian và tích vector–Jacobian</title><desc id="d">Vector hàng gradient theo z kích thước một nhân N nhân Jacobian N nhân M tạo gradient theo x kích thước một nhân M.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="95" width="190" height="80" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><rect x="355" y="55" width="190" height="160" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><rect x="665" y="95" width="190" height="80" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="140" y="130" font-size="26">Gz</text><text x="140" y="160" font-size="20">1 × N</text><text x="450" y="125" font-size="26">∂z/∂x</text><text x="450" y="160" font-size="20">N × M</text><text x="760" y="130" font-size="26">Gx</text><text x="760" y="160" font-size="20">1 × M</text><text x="295" y="145" font-size="34">×</text><text x="605" y="145" font-size="34">=</text><text x="450" y="250" font-size="21">lan truyền ngược dùng tích này, không cần dựng Jacobian dày đặc</text></g></svg>
