<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="t d"><title id="t">Mặt nạ gradient qua ReLU</title><desc id="d">Đầu vào âm và bằng không chặn gradient; đầu vào dương truyền gradient thượng nguồn.</desc><g font-family="sans-serif" text-anchor="middle"><text x="450" y="38" font-size="24">A = [−2, 0, 3] · GH = [4, 5, 6]</text><g font-size="21"><rect x="80" y="75" width="190" height="75" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/><rect x="355" y="75" width="190" height="75" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><rect x="630" y="75" width="190" height="75" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="175" y="107">A&lt;0: chặn</text><text x="175" y="137">GA=0</text><text x="450" y="107">A=0: chọn 0</text><text x="450" y="137">GA=0</text><text x="725" y="107">A&gt;0: truyền</text><text x="725" y="137">GA=6</text></g><text x="450" y="212" font-size="26">GA = GH ⊙ 𝟙[A &gt; 0] = [0, 0, 6]</text></g></svg>
