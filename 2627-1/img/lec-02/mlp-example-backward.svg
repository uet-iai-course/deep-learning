<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="t d"><title id="t">Lan truyền ngược của ví dụ MLP</title><desc id="d">Gradient từ mất mát trung bình đi qua điểm số, tầng ra, ReLU và tầng ẩn; gradient tham số được tính trước khi cập nhật.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#b15a2b"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><g fill="#fff" stroke="#2f3e7a" stroke-width="3"><rect x="30" y="115" width="145" height="85" rx="12"/><rect x="225" y="115" width="145" height="85" rx="12"/><rect x="420" y="115" width="145" height="85" rx="12"/><rect x="615" y="115" width="145" height="85" rx="12"/><rect x="810" y="115" width="145" height="85" rx="12"/></g><g font-size="21"><text x="102" y="150">GW₁, gb₁</text><text x="102" y="180">tầng ẩn</text><text x="297" y="150">GA</text><text x="297" y="180">mặt nạ ReLU</text><text x="492" y="150">GH</text><text x="492" y="180">GZ W₂ᵀ</text><text x="687" y="150">GW₂, gb₂</text><text x="687" y="180">tầng ra</text><text x="882" y="150">GZ</text><text x="882" y="180">(P−Y)/B</text></g><g stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"><path d="M810 157H765"/><path d="M615 157H570"/><path d="M420 157H375"/><path d="M225 157H180"/></g><text x="490" y="55" font-size="24" fill="#b15a2b">gradient đi từ phải sang trái</text><text x="490" y="275" font-size="22">tính đủ GW₁, gb₁, GW₂, gb₂ rồi mới cập nhật tham số</text></g></svg>
