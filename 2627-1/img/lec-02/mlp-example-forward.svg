<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="t d"><title id="t">Lan truyền xuôi của ví dụ MLP hai mẫu</title><desc id="d">Lô X hai nhân hai đi qua tầng ẩn hai đơn vị ReLU và tầng ra ba logit rồi softmax.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="25" y="100" width="140" height="90" rx="12"/><rect x="220" y="100" width="140" height="90" rx="12"/><rect x="415" y="100" width="140" height="90" rx="12"/><rect x="610" y="100" width="140" height="90" rx="12"/><rect x="805" y="100" width="140" height="90" rx="12"/></g><g font-size="22"><text x="95" y="140">X</text><text x="95" y="170">2 × 2</text><text x="290" y="140">A=XW₁+b₁</text><text x="290" y="170">2 × 2</text><text x="485" y="140">H=ReLU(A)</text><text x="485" y="170">2 × 2</text><text x="680" y="140">Z=HW₂+b₂</text><text x="680" y="170">2 × 3</text><text x="875" y="140">P=softmax(Z)</text><text x="875" y="170">2 × 3</text></g><g stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M165 145H215"/><path d="M360 145H410"/><path d="M555 145H605"/><path d="M750 145H800"/></g><text x="450" y="45" font-size="24" fill="#b15a2b">mọi hàng là một mẫu; softmax chạy theo ba lớp trong từng hàng</text><text x="450" y="265" font-size="21">X=[[1,2],[−2,1]] → A=[[3,.5],[−1,2.5]] → H=[[3,.5],[0,2.5]]</text></g></svg>
