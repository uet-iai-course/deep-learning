<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Một bước huấn luyện</title><desc id="d">Lan truyền xuôi và lưu giá trị kích hoạt, tính mất mát, lan truyền ngược, cập nhật đồng thời rồi bắt đầu lô kế tiếp.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="50" y="120" width="160" height="80" rx="14"/><rect x="265" y="35" width="160" height="80" rx="14"/><rect x="475" y="35" width="160" height="80" rx="14"/><rect x="690" y="120" width="160" height="80" rx="14"/><rect x="370" y="225" width="160" height="80" rx="14"/></g><g font-size="21"><text x="130" y="153">lô mới</text><text x="130" y="182">X, Y</text><text x="345" y="68">lan truyền xuôi</text><text x="345" y="97">lưu giá trị kích hoạt</text><text x="555" y="68">mất mát</text><text x="555" y="97">J</text><text x="770" y="153">lan truyền ngược</text><text x="770" y="182">mọi gradient</text><text x="450" y="258">cập nhật đồng thời</text><text x="450" y="287">θ ← θ − ηGθ</text></g><g stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M205 125L280 105"/><path d="M425 75H470"/><path d="M635 105L695 130"/><path d="M730 200L525 240"/><path d="M375 265C180 290 40 260 70 205"/></g></g></svg>
