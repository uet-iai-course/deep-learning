<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="t d"><title id="t">Gradient đầu vào bằng gradient thượng nguồn nhân đạo hàm cục bộ</title><desc id="d">Nút v bằng g của u nhận gradient vạch trên v và trả gradient vạch trên u.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><rect x="340" y="80" width="220" height="100" rx="16" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="450" y="122" font-size="25">v = g(u)</text><text x="450" y="158" font-size="21">cục bộ: ∂v/∂u</text><path d="M100 130H330M570 130H800" stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"/><text x="205" y="105" font-size="25">ū = v̄ · ∂v/∂u</text><text x="685" y="105" font-size="25">v̄ = ∂J/∂v</text><text x="450" y="225" font-size="22" fill="#b15a2b">mỗi nhánh đóng góp: ū += v̄ · ∂v/∂u</text></g></svg>
