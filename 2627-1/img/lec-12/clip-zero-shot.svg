<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="t d"><title id="t">Phân loại zero-shot bằng CLIP</title><desc id="d">Tên các lớp được đặt vào cùng một mẫu câu và mã hóa thành vectơ lớp. Biểu diễn ảnh được so sánh với từng vectơ lớp để tạo điểm phân loại. Điểm được chia cho hệ số nhiệt độ tau (dạng 1/τ) trước softmax theo trục lớp.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1100" height="350" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle"><g font-size="23"><rect x="28" y="52" width="250" height="58" rx="9" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="153" y="88">“ảnh một con chó”</text><rect x="28" y="133" width="250" height="58" rx="9" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="153" y="169">“ảnh một chiếc xe”</text><rect x="28" y="214" width="250" height="58" rx="9" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="153" y="250">“ảnh một con chim”</text><rect x="365" y="105" width="225" height="115" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="477" y="153">Bộ mã hóa</text><text x="477" y="186">văn bản</text><rect x="365" y="270" width="225" height="58" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="477" y="306">Bộ mã hóa ảnh</text><circle cx="690" cy="81" r="34" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="690" y="88">e(T,1)</text><circle cx="690" cy="162" r="34" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="690" y="169">e(T,2)</text><circle cx="690" cy="243" r="34" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="690" y="250">e(T,3)</text><circle cx="690" cy="306" r="34" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="690" y="313">e(I)</text><rect x="805" y="95" width="240" height="150" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="925" y="137">điểm Z(n,k)</text><text x="925" y="176">so sánh với K lớp</text><text x="925" y="215">softmax theo K</text><text x="925" y="292" fill="#b15a2b">lớp có điểm cao nhất</text></g></g><g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M278 81H357M278 162H357M278 243H357M590 135L650 92M590 162H648M590 190L650 231M590 299H648M728 81L797 119M728 162H797M728 243L797 206M728 306L814 245"/></g></svg>
