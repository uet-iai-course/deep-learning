<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Mặt nạ hai chiều và nhân quả</title><desc id="d">Hàng là truy vấn, cột là khóa. Ô được phép nghĩa là khóa không phải vị trí đệm; ma trận bên trái cho phép mọi khóa hợp lệ, ma trận bên phải chỉ cho phép khóa ở hiện tại và quá khứ.</desc><rect width="900" height="360" fill="#fff"/><g font-family="Arial,sans-serif" font-size="24" fill="#172554" text-anchor="middle"><text x="245" y="28">Bộ mã hóa: hai chiều</text><text x="655" y="28">Bộ giải mã: nhân quả</text></g><g font-family="Arial,sans-serif" font-size="22" fill="#172554" text-anchor="middle"><text x="220" y="58">cột = khóa</text><text x="630" y="58">cột = khóa</text><text transform="translate(82 190) rotate(-90)">hàng = truy vấn</text><text transform="translate(492 190) rotate(-90)">hàng = truy vấn</text></g><g transform="translate(95 65)"><g fill="#dbeafe" stroke="#fff" stroke-width="3"><path d="M0 0h250v250H0z"/></g><g stroke="#2f3e7a" stroke-width="2"><path d="M0 50h250M0 100h250M0 150h250M0 200h250M50 0v250M100 0v250M150 0v250M200 0v250"/></g></g><g transform="translate(505 65)" stroke="#fff" stroke-width="3"><path d="M0 0h50v50H0zM0 50h100v50H0zM0 100h150v50H0zM0 150h200v50H0zM0 200h250v50H0z" fill="#dbeafe"/><path d="M50 0h200v50H50zM100 50h150v50H100zM150 100h100v50H150zM200 150h50v50H200z" fill="#eee"/><g stroke="#2f3e7a" stroke-width="2"><path d="M0 50h250M0 100h250M0 150h250M0 200h250M50 0v250M100 0v250M150 0v250M200 0v250"/></g></g><g font-family="Arial,sans-serif" font-size="22" fill="#172554"><rect x="335" y="325" width="24" height="20" fill="#dbeafe"/><text x="370" y="342">được phép</text><rect x="545" y="325" width="24" height="20" fill="#eee"/><text x="580" y="342">bị chặn</text></g></svg>
