<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="t d"><title id="t">CLIP dùng hai bộ mã hóa</title><desc id="d">Một lô gồm các cặp ảnh và văn bản. Ảnh đi qua bộ mã hóa ảnh, văn bản đi qua bộ mã hóa văn bản; hai đầu ra được chuẩn hóa và chiếu vào cùng không gian biểu diễn.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1100" height="340" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle"><text x="125" y="42" font-size="27">Cặp dữ liệu</text><text x="930" y="42" font-size="27">Không gian chung</text><g font-size="24"><rect x="35" y="82" width="180" height="72" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="125" y="126">ảnh x(i)</text><rect x="35" y="210" width="180" height="72" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="125" y="254">văn bản t(i)</text><rect x="330" y="72" width="225" height="92" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="442" y="113">Bộ mã hóa ảnh</text><text x="442" y="144" font-size="20">tham số riêng</text><rect x="330" y="200" width="225" height="92" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="442" y="241">Bộ mã hóa văn bản</text><text x="442" y="272" font-size="20">tham số riêng</text><rect x="670" y="72" width="210" height="92" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="775" y="111">Chiếu + chuẩn hóa</text><text x="775" y="144" font-size="21">e(I,i) thuộc R^D</text><rect x="670" y="200" width="210" height="92" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="775" y="239">Chiếu + chuẩn hóa</text><text x="775" y="272" font-size="21">e(T,i) thuộc R^D</text><circle cx="990" cy="118" r="45" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="990" y="126">e(I,i)</text><circle cx="990" cy="246" r="45" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="990" y="254">e(T,i)</text></g></g><g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M215 118H322M555 118H662M880 118H937"/><path d="M215 246H322M555 246H662M880 246H937"/></g><path d="M125 160V202" stroke="#667085" stroke-width="3" stroke-dasharray="7 7"/><text x="145" y="190" font-family="Arial,sans-serif" font-size="20" fill="#667085">ghép cặp</text></svg>
