<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="t d"><title id="t">Luồng dữ liệu Vision Transformer</title><desc id="d">Ảnh ba kênh được chia thành lưới bốn nhân bốn, làm phẳng thành 16 mảnh, chiếu sang chiều 64, thêm CLS và vị trí, qua bộ mã hóa rồi phân loại.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1100" height="350" fill="#fff"/><g stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M210 170H285M455 170H525M695 170H760M920 170H990"/></g><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle"><g font-size="24"><text x="120" y="42">Ảnh NCHW</text><text x="370" y="42">16 mảnh</text><text x="610" y="42">Chiếu + vị trí</text><text x="840" y="42">Bộ mã hóa</text><text x="1035" y="42">Phân lớp</text></g><rect x="40" y="80" width="160" height="180" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><g stroke="#2f3e7a"><path d="M80 80v180M120 80v180M160 80v180M40 125h160M40 170h160M40 215h160"/></g><text x="120" y="300" font-size="22">2×3×32×32</text><rect x="295" y="95" width="150" height="150" rx="8" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="370" y="158" font-size="25">làm phẳng</text><text x="370" y="193" font-size="25">P = 8</text><text x="370" y="300" font-size="22">2×16×192</text><rect x="535" y="95" width="150" height="150" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="610" y="148" font-size="25">D = 64</text><text x="610" y="185" font-size="25">+ CLS</text><text x="610" y="215" font-size="22">+ vị trí</text><text x="610" y="300" font-size="22">2×17×64</text><rect x="770" y="95" width="140" height="150" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="840" y="158" font-size="25">L khối</text><text x="840" y="193" font-size="22">chuẩn hóa trước</text><text x="840" y="300" font-size="22">2×17×64</text><rect x="1000" y="115" width="80" height="110" rx="8" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="1040" y="165" font-size="23">CLS</text><text x="1040" y="198" font-size="23">→ K</text><text x="1040" y="300" font-size="22">2×K</text></g></svg>
