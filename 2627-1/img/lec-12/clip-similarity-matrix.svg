<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="t d">
  <title id="t">Ma trận tương đồng ảnh–văn bản</title>
  <desc id="d">Hàng biểu diễn ảnh, cột biểu diễn văn bản. Các biểu diễn ảnh và văn bản đã được chuẩn hóa L2 theo hàng; điểm tương đồng là $S=E_IE_T^\top/\tau$ với hệ số nhiệt độ tau dương. Các ô đường chéo là cặp đúng; cross-entropy được tính theo cả hàng và cột.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs>
  <rect width="920" height="360" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#172554">
    <text x="390" y="34" font-size="25" text-anchor="middle">cột = văn bản</text>
    <text x="82" y="168" font-size="23" text-anchor="middle">hàng</text>
    <text x="82" y="198" font-size="23" text-anchor="middle">= ảnh</text>
    <g transform="translate(170 55)">
      <rect x="0" y="0" width="440" height="240" fill="#fff" stroke="#2f3e7a" stroke-width="2"/>
      <g fill="#f7efe6"><rect x="0" y="0" width="110" height="60"/><rect x="110" y="60" width="110" height="60"/><rect x="220" y="120" width="110" height="60"/><rect x="330" y="180" width="110" height="60"/></g>
      <g stroke="#2f3e7a" stroke-width="2"><path d="M0 60H440M0 120H440M0 180H440M110 0V240M220 0V240M330 0V240"/></g>
      <g font-size="22" text-anchor="middle">
        <text x="55" y="38">S(1,1)</text><text x="165" y="38">S(1,2)</text><text x="275" y="38">S(1,3)</text><text x="385" y="38">S(1,4)</text>
        <text x="55" y="98">S(2,1)</text><text x="165" y="98">S(2,2)</text><text x="275" y="98">S(2,3)</text><text x="385" y="98">S(2,4)</text>
        <text x="55" y="158">S(3,1)</text><text x="165" y="158">S(3,2)</text><text x="275" y="158">S(3,3)</text><text x="385" y="158">S(3,4)</text>
        <text x="55" y="218">S(4,1)</text><text x="165" y="218">S(4,2)</text><text x="275" y="218">S(4,3)</text><text x="385" y="218">S(4,4)</text>
      </g>
    </g>
    <g font-size="23">
      <rect x="655" y="80" width="215" height="75" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="762" y="111" text-anchor="middle">theo hàng</text><text x="762" y="140" text-anchor="middle">ảnh → văn bản</text>
      <rect x="655" y="200" width="215" height="75" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="762" y="231" text-anchor="middle">theo cột</text><text x="762" y="260" text-anchor="middle">văn bản → ảnh</text>
      <rect x="170" y="315" width="28" height="22" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="215" y="334">cặp đúng</text>
    </g>
  </g>
  <g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M615 118H647"/><path d="M610 240H647"/></g>
</svg>
