<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="t d"><title id="t">Ma trận điểm truy vấn khóa</title><desc id="d">Ba truy vấn tạo ba hàng và ba khóa tạo ba cột của ma trận điểm.</desc><rect width="900" height="320" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle" font-size="26"><text x="455" y="35">cột = khóa</text><text transform="translate(175 180) rotate(-90)">hàng = truy vấn</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"><rect x="230" y="65" width="450" height="210"/></g><g stroke="#2f3e7a" stroke-width="2"><path d="M380 65V275M530 65V275M230 135H680M230 205H680"/></g><text x="305" y="110">q1·k1</text><text x="455" y="110">q1·k2</text><text x="605" y="110">q1·k3</text><text x="305" y="180">q2·k1</text><text x="455" y="180">q2·k2</text><text x="605" y="180">q2·k3</text><text x="305" y="250">q3·k1</text><text x="455" y="250">q3·k2</text><text x="605" y="250">q3·k3</text></g></svg>
