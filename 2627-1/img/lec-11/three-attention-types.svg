<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="320" viewBox="0 0 1050 320" role="img" aria-labelledby="t d"><title id="t">Ba loại chú ý trong Transformer</title><desc id="d">Ba cột cho thấy nguồn Q K V của tự chú ý bộ mã hóa, tự chú ý nhân quả bộ giải mã và chú ý chéo.</desc><rect width="1050" height="320" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle" font-size="24"><text x="175" y="34">Tự chú ý nguồn</text><text x="525" y="34">Tự chú ý đích</text><text x="875" y="34">Chú ý chéo</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"><rect x="55" y="75" width="240" height="165" rx="10"/><rect x="405" y="75" width="240" height="165" rx="10"/><rect x="755" y="75" width="240" height="165" rx="10"/></g><text x="175" y="125">Q, K, V: nguồn</text><text x="175" y="175">mặt nạ hợp lệ</text><text x="525" y="125">Q, K, V: đích</text><text x="525" y="175">hợp lệ + nhân quả</text><text x="875" y="115">Q: đích</text><text x="875" y="155">K, V: nguồn</text><text x="875" y="195">mặt nạ nguồn</text><text x="525" y="285">hàng = truy vấn · cột = khóa</text></g></svg>
