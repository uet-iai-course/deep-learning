<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Từ chú ý chéo đến tự chú ý</title><desc id="d">Bên trái truy vấn đến từ bộ giải mã còn khóa và giá trị đến từ bộ mã hóa; bên phải cả ba đến từ cùng chuỗi.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="320" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle" font-size="26"><text x="250" y="35">Chú ý chéo</text><text x="750" y="35">Tự chú ý</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"><rect x="70" y="90" width="180" height="70" rx="10"/><rect x="70" y="220" width="180" height="70" rx="10"/><rect x="660" y="205" width="180" height="70" rx="10"/></g><text x="160" y="133">Bộ giải mã</text><text x="160" y="263">Bộ mã hóa</text><text x="750" y="248">Cùng chuỗi X</text><g stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M255 125H410"/><path d="M255 255H410"/><path d="M845 240H930V110H850"/></g><text x="455" y="120">Q</text><text x="455" y="235">K, V</text><text x="780" y="110">Q, K, V</text></g></svg>
