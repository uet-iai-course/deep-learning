<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" role="img" aria-labelledby="t d">
  <title id="t">Một tầng bộ giải mã được lặp L dec lần</title>
  <desc id="d">Trạng thái G tầng ell trừ một đi qua tự chú ý nhân quả, bỏ ngẫu nhiên, chú ý chéo, bỏ ngẫu nhiên và FFN, bỏ ngẫu nhiên để tạo G tầng ell. Ba mũi tên vòng là ba đường dư; đầu ra mã hóa cấp khóa và giá trị cho mọi tầng. Hợp đồng được lặp L dec tầng.</desc>
