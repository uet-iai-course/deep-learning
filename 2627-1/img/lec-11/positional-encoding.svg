<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Cộng mã hóa vị trí vào chuỗi</title><desc id="d">Tensor X một lô ba vị trí bốn chiều được cộng ma trận vị trí ba nhân bốn, phát qua trục lô, để tạo đầu vào Transformer cùng kích thước.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="320" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle" font-size="25"><rect x="45" y="75" width="230" height="170" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="160" y="125">X</text><text x="160" y="165">1 × 3 × 4</text><text x="325" y="170">+</text><rect x="375" y="75" width="250" height="170" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="500" y="115">PE0, PE1, PE2</text><text x="500" y="160">sin / cos</text><text x="500" y="200">3 × 4</text><path d="M635 160H720" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="730" y="75" width="225" height="170" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="842" y="125">H0 = X + PE</text><text x="842" y="175">1 × 3 × 4</text></g></svg>
