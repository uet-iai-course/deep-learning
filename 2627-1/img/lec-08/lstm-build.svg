<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
  <title id="title">Bốn tín hiệu trong một ô LSTM</title><desc id="desc">Đầu vào và trạng thái ẩn trước tạo ứng viên, cổng vào, cổng quên và cổng ra; các tín hiệu điều khiển cập nhật trạng thái ô và trạng thái ẩn.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs>
  <rect x="35" y="128" width="170" height="90" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="120" y="165" text-anchor="middle" font-size="25" font-family="Arial">[Xₜ, Hₜ₋₁]</text><text x="120" y="196" text-anchor="middle" font-size="22" font-family="Arial">thông tin chung</text>
  <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="315" y="28" width="160" height="70" rx="10"/><rect x="315" y="112" width="160" height="70" rx="10"/><rect x="315" y="196" width="160" height="70" rx="10"/><rect x="315" y="280" width="160" height="70" rx="10"/></g>
  <g font-family="Arial" text-anchor="middle" fill="#263238"><text x="395" y="58" font-size="24">Ứng viên Gₜ</text><text x="395" y="84" font-size="22">tanh</text><text x="395" y="142" font-size="24">Cổng vào Iₜ</text><text x="395" y="168" font-size="22">sigmoid</text><text x="395" y="226" font-size="24">Cổng quên Fₜ</text><text x="395" y="252" font-size="22">sigmoid</text><text x="395" y="310" font-size="24">Cổng ra Oₜ</text><text x="395" y="336" font-size="22">sigmoid</text></g>
  <g stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M205 173 C255 173 255 63 310 63"/><path d="M205 173 C255 173 255 147 310 147"/><path d="M205 173 C255 173 255 231 310 231"/><path d="M205 173 C255 173 255 315 310 315"/></g>
  <rect x="610" y="92" width="190" height="165" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="705" y="135" text-anchor="middle" font-size="25" font-family="Arial">Cập nhật Cₜ</text><text x="705" y="177" text-anchor="middle" font-size="23" font-family="Arial">Fₜ ⊙ Cₜ₋₁</text><text x="705" y="210" text-anchor="middle" font-size="23" font-family="Arial">+ Iₜ ⊙ Gₜ</text><text x="705" y="241" text-anchor="middle" font-size="22" font-family="Arial">rồi tạo Hₜ</text>
  <g stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M475 63 C545 63 545 152 605 152"/><path d="M475 147 H605"/><path d="M475 231 H605"/><path d="M475 315 C545 315 545 230 605 230"/><path d="M800 175 H950"/></g><text x="885" y="155" text-anchor="middle" font-size="25" font-family="Arial">(Cₜ, Hₜ)</text>
</svg>
