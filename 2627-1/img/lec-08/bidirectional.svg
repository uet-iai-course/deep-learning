<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">RNN hai chiều</title><desc id="desc">Một chuỗi được đọc từ trái sang phải và từ phải sang trái; tại mỗi vị trí hai trạng thái được nối để tạo biểu diễn có ngữ cảnh hai phía.</desc>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2f3e7a"/></marker><marker id="al" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M8,0 L8,6 L0,3 z" fill="#b15a2b"/></marker></defs>
  <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="130" y="230" width="120" height="55" rx="9"/><rect x="375" y="230" width="120" height="55" rx="9"/><rect x="620" y="230" width="120" height="55" rx="9"/><rect x="865" y="230" width="120" height="55" rx="9"/></g>
  <g font-family="Arial" font-size="23" text-anchor="middle"><text x="190" y="265">X₁</text><text x="435" y="265">X₂</text><text x="680" y="265">X₃</text><text x="925" y="265">X₄</text></g>
  <g fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"><rect x="130" y="125" width="120" height="55" rx="9"/><rect x="375" y="125" width="120" height="55" rx="9"/><rect x="620" y="125" width="120" height="55" rx="9"/><rect x="865" y="125" width="120" height="55" rx="9"/></g>
  <g fill="#f7efe6" stroke="#b15a2b" stroke-width="3"><rect x="130" y="40" width="120" height="55" rx="9"/><rect x="375" y="40" width="120" height="55" rx="9"/><rect x="620" y="40" width="120" height="55" rx="9"/><rect x="865" y="40" width="120" height="55" rx="9"/></g>
  <g font-family="Arial" font-size="22" text-anchor="middle"><text x="190" y="160">H⃗₁</text><text x="435" y="160">H⃗₂</text><text x="680" y="160">H⃗₃</text><text x="925" y="160">H⃗₄</text><text x="190" y="75">H⃖₁</text><text x="435" y="75">H⃖₂</text><text x="680" y="75">H⃖₃</text><text x="925" y="75">H⃖₄</text></g>
