<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="410" viewBox="0 0 1050 410" role="img" aria-labelledby="title desc">
  <title id="title">Luồng tính đầy đủ của ô LSTM</title><desc id="desc">Cổng quên nhân trạng thái ô trước, cổng vào nhân ứng viên, hai nhánh được cộng để tạo trạng thái ô mới; cổng ra lọc tanh của trạng thái ô để tạo trạng thái ẩn.</desc>
