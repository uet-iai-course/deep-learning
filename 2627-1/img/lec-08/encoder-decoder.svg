<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">Bộ mã hóa GRU khởi tạo bộ giải mã GRU</title><desc id="desc">Bộ mã hóa GRU đọc chuỗi nguồn và tạo ngữ cảnh Q từ trạng thái cuối hợp lệ; Q khởi tạo trạng thái bộ giải mã GRU, bộ giải mã nhận ký hiệu bắt đầu rồi lần lượt dự đoán chuỗi đích.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs>
  <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="45" y="245" width="130" height="58" rx="9"/><rect x="205" y="245" width="130" height="58" rx="9"/><rect x="365" y="245" width="130" height="58" rx="9"/><rect x="610" y="245" width="130" height="58" rx="9"/><rect x="770" y="245" width="130" height="58" rx="9"/><rect x="930" y="245" width="110" height="58" rx="9"/></g>
  <g fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"><rect x="45" y="135" width="130" height="66" rx="9"/><rect x="205" y="135" width="130" height="66" rx="9"/><rect x="365" y="135" width="130" height="66" rx="9"/></g>
  <g fill="#f7efe6" stroke="#b15a2b" stroke-width="3"><rect x="610" y="135" width="130" height="66" rx="9"/><rect x="770" y="135" width="130" height="66" rx="9"/><rect x="930" y="135" width="110" height="66" rx="9"/></g>
  <g font-family="Arial" font-size="22" text-anchor="middle"><text x="110" y="280">“tôi”</text><text x="270" y="280">“học”</text><text x="430" y="280">“máy”</text><text x="675" y="280">&lt;bos&gt;</text><text x="835" y="280">“I”</text><text x="985" y="280">“learn”</text><text x="110" y="175">GRU mã hóa 1</text><text x="270" y="175">GRU mã hóa 2</text><text x="430" y="175">GRU mã hóa 3</text><text x="675" y="175">GRU giải mã 1</text><text x="835" y="175">GRU giải mã 2</text><text x="985" y="175">GRU giải mã 3</text></g>
  <g stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M110 245 V206"/><path d="M270 245 V206"/><path d="M430 245 V206"/><path d="M175 168 H200"/><path d="M335 168 H360"/><path d="M495 168 C550 168 550 90 605 90 C660 90 660 125 675 130"/><path d="M675 245 V206"/><path d="M835 245 V206"/><path d="M985 245 V206"/><path d="M740 168 H765"/><path d="M900 168 H925"/></g>
  <text x="550" y="65" font-size="24" text-anchor="middle" font-family="Arial" fill="#2f3e7a">ngữ cảnh Q → S₀</text><text x="270" y="345" font-size="24" text-anchor="middle" font-family="Arial">chuỗi nguồn</text><text x="825" y="345" font-size="24" text-anchor="middle" font-family="Arial">chuỗi đích</text>
</svg>
