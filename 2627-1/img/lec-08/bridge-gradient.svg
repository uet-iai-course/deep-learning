<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Hai đường truyền trạng thái qua thời gian</title><desc id="desc">Đường trạng thái của RNN cơ bản lặp phép nhân ma trận và hàm kích hoạt, còn LSTM bổ sung đường cập nhật cộng có cổng.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs>
  <text x="35" y="65" font-size="26" font-family="Arial" fill="#263238">RNN cơ bản</text><text x="35" y="210" font-size="26" font-family="Arial" fill="#263238">LSTM</text>
  <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="230" y="28" width="130" height="62" rx="10"/><rect x="445" y="28" width="130" height="62" rx="10"/><rect x="660" y="28" width="130" height="62" rx="10"/><rect x="230" y="175" width="130" height="62" rx="10"/><rect x="445" y="175" width="130" height="62" rx="10"/><rect x="660" y="175" width="130" height="62" rx="10"/></g>
  <g font-size="24" font-family="Arial" text-anchor="middle" fill="#263238"><text x="295" y="68">Hₜ₋₂</text><text x="510" y="68">Hₜ₋₁</text><text x="725" y="68">Hₜ</text><text x="295" y="215">Cₜ₋₂</text><text x="510" y="215">Cₜ₋₁</text><text x="725" y="215">Cₜ</text></g>
  <g stroke="#2f3e7a" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M360 59 H440"/><path d="M575 59 H655"/><path d="M360 206 H440"/><path d="M575 206 H655"/></g>
  <g font-size="22" font-family="Arial" text-anchor="middle"><text x="400" y="40" fill="#b15a2b">ma trận + tanh</text><text x="615" y="40" fill="#b15a2b">ma trận + tanh</text><text x="400" y="262" fill="#2e7d32">nhân cổng + cộng</text><text x="615" y="262" fill="#2e7d32">nhân cổng + cộng</text></g>
</svg>
