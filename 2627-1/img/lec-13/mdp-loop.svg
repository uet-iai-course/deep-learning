<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Vòng tương tác tác tử và môi trường</title><desc id="d">Tác tử nhận trạng thái S t và chọn hành động A t; môi trường trả trạng thái S t cộng một và phần thưởng R t cộng một.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="900" height="340" fill="#fff"/><g font-family="Arial,sans-serif" font-size="27" text-anchor="middle" fill="#172554"><rect x="95" y="105" width="250" height="115" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><rect x="555" y="105" width="250" height="115" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="220" y="172">Tác tử π</text><text x="680" y="172">Môi trường</text><path d="M350 135H545" stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"/><text x="448" y="115">A(t)</text><path d="M550 210C450 310 350 310 250 225" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"/><text x="450" y="302">S(t+1), R(t+1)</text></g></svg>
