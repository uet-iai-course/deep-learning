<svg xmlns="http://www.w3.org/2000/svg" width="950" height="300" viewBox="0 0 950 300" role="img" aria-labelledby="t d"><title id="t">Một chuyển tiếp của hành lang</title><desc id="d">Từ trạng thái s1, hành động phải nhận phần thưởng không và tới trạng thái s2; tại s2 cần giá trị hành động lớn nhất để tạo đích sai phân thời gian.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="950" height="300" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><circle cx="180" cy="145" r="65" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><circle cx="580" cy="145" r="65" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="180" y="153" font-size="28">s1</text><text x="580" y="153" font-size="28">s2</text><path d="M250 145H505" stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"/><text x="378" y="115" font-size="24">a = phải, R = 0</text><rect x="700" y="90" width="200" height="110" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="800" y="135" font-size="24">tại s2:</text><text x="800" y="172" font-size="24">max Q(s2, ·)</text><path d="M650 145H690" stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"/></g></svg>
