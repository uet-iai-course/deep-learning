<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Hành lang minh họa</title><desc id="d">Ba trạng thái nối theo hướng phải đến đích; từ trạng thái đầu có một nhánh đi xuống vùng chưa có trình diễn.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="300" fill="#fff"/><g font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#172554"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="70" y="85" width="150" height="85" rx="10"/><rect x="310" y="85" width="150" height="85" rx="10"/><rect x="550" y="85" width="150" height="85" rx="10"/></g><rect x="790" y="85" width="150" height="85" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="145" y="137">s0</text><text x="385" y="137">s1</text><text x="625" y="137">s2</text><text x="865" y="137">đích</text><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M225 128H302M465 128H542M705 128H782"/></g><path d="M145 175V232" stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"/><rect x="70" y="232" width="150" height="50" rx="10" fill="#fdf3e7" stroke="#b15a2b" stroke-width="3"/><text x="145" y="266" font-size="22">trạng thái lệch</text><text x="470" y="266" fill="#b15a2b" font-size="22">chưa có nhãn chuyên gia</text></g></svg>
