<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Đường dữ liệu và gradient của DQN</title>
  <desc id="desc">Tác tử thu thập chuyển tiếp, lưu vào bộ nhớ phát lại và lấy mẫu một lô. Mạng hiện tại chọn giá trị theo hành động đã làm. Mạng đích lấy cực đại ở trạng thái kế tiếp, áp dụng mặt nạ kết thúc, nhân gamma và cộng phần thưởng để tạo đích ngắt gradient. Dự đoán và đích tạo mất mát.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2f3e7a"/></marker>
    <style>.b{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}.t{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.o{fill:#fff;stroke:#2f3e7a;stroke-width:3}.a{fill:none;stroke:#2f3e7a;stroke-width:4;marker-end:url(#arrow)}.txt{font:32px Arial,sans-serif;fill:#172554;text-anchor:middle}.sm{font:28px Arial,sans-serif;fill:#172554;text-anchor:middle}</style>
  </defs>
  <rect width="1200" height="360" fill="#fff"/>
  <rect class="b" x="20" y="25" width="180" height="68" rx="10"/><text class="txt" x="110" y="69">Thu thập</text>
  <rect class="b" x="250" y="25" width="180" height="68" rx="10"/><text class="txt" x="340" y="69">Lưu</text>
  <rect class="b" x="480" y="25" width="180" height="68" rx="10"/><text class="txt" x="570" y="69">Lấy mẫu</text>
  <path class="a" d="M205 59H240"/><path class="a" d="M435 59H470"/>
  <text class="sm" x="340" y="124">Lô (S, A, R, S', cờ)</text>
  <rect class="b" x="25" y="170" width="205" height="68" rx="10"/><text class="sm" x="128" y="213">Q hiện tại(S)</text>
  <rect class="b" x="275" y="170" width="190" height="68" rx="10"/><text class="sm" x="370" y="213">Chọn theo A</text>
  <path class="a" d="M235 204H265"/>
  <rect class="o" x="510" y="170" width="105" height="68" rx="34"/><text class="txt" x="563" y="214">q</text>
  <path class="a" d="M470 204H500"/>
  <rect class="t" x="25" y="275" width="205" height="68" rx="10"/><text class="sm" x="128" y="318">Q đích(S')</text>
  <rect class="t" x="275" y="275" width="160" height="68" rx="10"/><text class="sm" x="355" y="318">Lấy max</text>
  <rect class="t" x="480" y="275" width="210" height="68" rx="10"/><text class="sm" x="585" y="304">Mặt nạ · gamma</text><text class="sm" x="585" y="335">+ R</text>
  <path class="a" d="M235 309H265"/><path class="a" d="M440 309H470"/>
  <rect class="o" x="735" y="275" width="105" height="68" rx="34"/><text class="txt" x="788" y="319">Y</text>
  <path class="a" d="M695 309H725"/><text class="sm" x="930" y="319">ngắt gradient</text>
  <rect class="o" x="980" y="160" width="185" height="88" rx="44"/><text class="txt" x="1073" y="215">Mất mát</text>
  <path class="a" d="M620 204H970"/><path class="a" d="M845 292C920 275 940 250 980 225"/>
</svg>
