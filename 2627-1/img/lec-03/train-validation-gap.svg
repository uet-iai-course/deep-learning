<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Khoảng cách huấn luyện và xác thực</title><desc id="desc">Mất mát huấn luyện tiếp tục giảm trong khi mất mát xác thực đạt cực tiểu rồi tăng; vị trí điểm lưu nằm tại cực tiểu xác thực.</desc><rect width="1000" height="360" fill="#fff"/><g font-family="Arial,sans-serif"><path d="M90 290V45M90 290H930" stroke="#777"/><path d="M105 75 C270 140 500 230 910 270" fill="none" stroke="#2f3e7a" stroke-width="7"/><path d="M105 105 C280 180 430 230 555 220 S760 135 910 85" fill="none" stroke="#b15a2b" stroke-width="7" stroke-dasharray="16 10"/><line x1="555" y1="45" x2="555" y2="290" stroke="#376c4a" stroke-width="3" stroke-dasharray="10 8"/><circle cx="555" cy="220" r="9" fill="#376c4a"/><g font-size="20"><text x="760" y="275" fill="#2f3e7a">huấn luyện</text><text x="760" y="115" fill="#b15a2b">xác thực</text><text x="570" y="65" fill="#376c4a">điểm lưu</text></g></g></svg>
