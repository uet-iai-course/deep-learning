<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Gradient qua chuỗi Jacobian</title><desc id="desc">Gradient đầu ra được nhân liên tiếp với các Jacobian cục bộ; chuẩn nhỏ hơn một làm triệt tiêu và chuẩn lớn hơn một làm bùng nổ.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="300" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="65" y="95" width="130" height="70" rx="12"/><rect x="270" y="95" width="130" height="70" rx="12"/><rect x="475" y="95" width="130" height="70" rx="12"/><rect x="680" y="95" width="130" height="70" rx="12"/><rect x="860" y="95" width="90" height="70" rx="12"/></g><g fill="#26345f" font-size="22"><text x="130" y="137">h₀</text><text x="335" y="137">h₁</text><text x="540" y="137">h₂</text><text x="745" y="137">h_L</text><text x="905" y="137">J</text></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"><path d="M270 195H195"/><path d="M475 195H400"/><path d="M680 195H605"/><path d="M860 195H810"/></g><g fill="#b15a2b" font-size="18"><text x="232" y="226">J₁ chuyển vị</text><text x="437" y="226">J₂ chuyển vị</text><text x="642" y="226">J_L chuyển vị</text><text x="835" y="226">gradient tại h_L</text></g><text x="500" y="270" fill="#26345f" font-size="21">gradient tại h₀ = tích Jacobian chuyển vị × gradient tại h_L</text></g></svg>
