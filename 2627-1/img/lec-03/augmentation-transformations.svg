<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Các phép tăng cường dữ liệu giữ nhãn</title><desc id="desc">Một mẫu hình học được lật, dịch cắt, đổi sáng và thêm nhiễu; mỗi nhánh phải bảo toàn nhãn theo bài toán.</desc><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="330" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#2f3e7a" stroke-width="4" fill="#edf4ff"><rect x="70" y="105" width="170" height="120" rx="12"/><rect x="410" y="20" width="170" height="85" rx="12"/><rect x="735" y="20" width="170" height="85" rx="12"/><rect x="410" y="225" width="170" height="85" rx="12"/><rect x="735" y="225" width="170" height="85" rx="12"/></g><path d="M100 195L155 125L210 195Z" fill="#b15a2b"/><g fill="#26345f" font-size="20"><text x="155" y="255">mẫu gốc</text><text x="495" y="70">lật / cắt</text><text x="820" y="70">màu / sáng</text><text x="495" y="275">nhiễu</text><text x="820" y="275">nén / méo</text></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#g)"><path d="M240 135L410 75"/><path d="M240 135L735 75"/><path d="M240 195L410 260"/><path d="M240 195L735 260"/></g><text x="550" y="170" font-size="22" fill="#376c4a">chỉ dùng phép biến đổi giữ nhãn</text></g></svg>
