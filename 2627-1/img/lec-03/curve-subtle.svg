<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Đường cong chưa hội tụ và quá khớp</title>
  <desc id="desc">Ô trái có mất mát huấn luyện nét liền và xác thực nét đứt cùng giảm; ô phải có huấn luyện tiếp tục giảm nhưng xác thực quay đầu tăng. Cả hai ô có trục bước cập nhật và mất mát.</desc>
  <rect width="1000" height="380" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#26345f">
    <g transform="translate(50 45)">
      <text x="215" y="0" text-anchor="middle" font-size="25">Chưa hội tụ</text><path d="M45 260V25M45 260H425" stroke="#555" stroke-width="2"/>
      <text x="235" y="300" text-anchor="middle" font-size="20">bước cập nhật</text><text x="-135" y="18" transform="rotate(-90)" text-anchor="middle" font-size="20">mất mát</text>
      <path d="M55 75 C145 120 235 155 415 200" fill="none" stroke="#2f3e7a" stroke-width="6"/>
      <path d="M55 95 C165 140 265 170 415 215" fill="none" stroke="#b15a2b" stroke-width="6" stroke-dasharray="16 10"/>
    </g>
    <g transform="translate(535 45)">
      <text x="215" y="0" text-anchor="middle" font-size="25">Quá khớp</text><path d="M45 260V25M45 260H425" stroke="#555" stroke-width="2"/>
      <text x="235" y="300" text-anchor="middle" font-size="20">bước cập nhật</text><text x="-135" y="18" transform="rotate(-90)" text-anchor="middle" font-size="20">mất mát</text>
      <path d="M55 70 C155 115 265 185 415 225" fill="none" stroke="#2f3e7a" stroke-width="6"/>
      <path d="M55 95 C145 145 210 175 260 168 S345 130 415 85" fill="none" stroke="#b15a2b" stroke-width="6" stroke-dasharray="16 10"/><circle cx="260" cy="168" r="8" fill="#fff" stroke="#b15a2b" stroke-width="4"/>
    </g>
    <g font-size="20"><line x1="340" y1="365" x2="390" y2="365" stroke="#2f3e7a" stroke-width="6"/><text x="400" y="371">huấn luyện</text><line x1="585" y1="365" x2="635" y2="365" stroke="#b15a2b" stroke-width="6" stroke-dasharray="16 10"/><text x="645" y="371">xác thực</text></g>
  </g>
</svg>
