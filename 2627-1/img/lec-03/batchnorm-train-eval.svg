<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Chuẩn hóa theo lô trong huấn luyện và suy luận</title>
  <desc id="desc">Nhánh huấn luyện dùng thống kê của lô hiện tại; nhánh suy luận dùng thống kê cố định được ước lượng trong quá trình huấn luyện. Hình không khóa cách cập nhật các thống kê cố định.</desc>
  <defs><marker id="e" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2f3e7a"/></marker></defs>
  <rect width="1000" height="360" fill="#fff"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3">
      <rect x="45" y="55" width="190" height="80" rx="12"/><rect x="315" y="55" width="270" height="80" rx="12"/><rect x="670" y="55" width="250" height="80" rx="12"/>
      <rect x="45" y="225" width="190" height="80" rx="12"/><rect x="315" y="225" width="270" height="80" rx="12"/><rect x="670" y="225" width="250" height="80" rx="12"/>
    </g>
    <g fill="#26345f" font-size="23">
      <text x="140" y="105">lô huấn luyện</text><text x="450" y="105">thống kê lô hiện tại</text><text x="795" y="105">chuẩn hóa + γ, β</text>
      <text x="140" y="275">mẫu suy luận</text><text x="450" y="262">thống kê cố định</text><text x="450" y="292" font-size="20">ước lượng từ huấn luyện</text><text x="795" y="275">chuẩn hóa + γ, β</text>
    </g>
    <g stroke="#2f3e7a" stroke-width="4" marker-end="url(#e)"><path d="M235 95H315"/><path d="M585 95H670"/><path d="M235 265H315"/><path d="M585 265H670"/></g>
    <text x="950" y="102" fill="#376c4a" font-size="21">theo lô</text><text x="950" y="272" fill="#376c4a" font-size="21">cố định</text>
  </g>
</svg>
