<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Luồng chuẩn hóa theo lô cho MLP</title><desc id="desc">Tensor X kích thước B nhân D đi qua tính thống kê theo trục B, chuẩn hóa, tỷ lệ dịch và kích hoạt.</desc><defs><marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="300" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="35" y="95" width="150" height="75" rx="12"/><rect x="245" y="95" width="170" height="75" rx="12"/><rect x="475" y="95" width="150" height="75" rx="12"/><rect x="685" y="95" width="150" height="75" rx="12"/><rect x="885" y="95" width="85" height="75" rx="12"/></g><g fill="#26345f" font-size="20"><text x="110" y="128">X: B × D</text><text x="110" y="153">đầu vào</text><text x="330" y="128">μ, σ²: D</text><text x="330" y="153">rút gọn B</text><text x="550" y="140">X chuẩn hóa</text><text x="760" y="128">tỷ lệ + dịch</text><text x="760" y="153">γ, β: D</text><text x="927" y="140">φ</text></g><g stroke="#2f3e7a" stroke-width="4" marker-end="url(#d)"><path d="M185 132H245"/><path d="M415 132H475"/><path d="M625 132H685"/><path d="M835 132H885"/></g><text x="500" y="235" fill="#b15a2b" font-size="20">Mọi đầu ra vẫn có kích thước B × D</text></g></svg>
