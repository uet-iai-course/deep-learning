<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Phương sai kích hoạt qua nhiều tầng</title><desc id="desc">Ba dải cho thấy phương sai giảm dần, được giữ gần ổn định hoặc tăng dần theo chiều sâu.</desc><rect width="1000" height="340" fill="#fff"/><g font-family="Arial,sans-serif" fill="#26345f"><path d="M70 270V45M70 270H940" stroke="#777"/><text x="15" y="55" font-size="17">phương sai</text><text x="845" y="310" font-size="17">chiều sâu</text><path d="M80 100 C300 135 560 215 920 255" fill="none" stroke="#9a6a3a" stroke-width="7"/><path d="M80 180 C330 175 650 185 920 178" fill="none" stroke="#2f3e7a" stroke-width="7"/><path d="M80 250 C330 230 640 130 920 55" fill="none" stroke="#b15a2b" stroke-width="7"/><g font-size="19"><text x="760" y="250" fill="#9a6a3a">triệt tiêu</text><text x="760" y="170" fill="#2f3e7a">gần ổn định</text><text x="760" y="78" fill="#b15a2b">bùng nổ</text></g></g></svg>
