<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Mạng Siamese chia sẻ bộ mã hóa</title><desc id="d">Hai mẫu đi qua cùng bộ mã hóa f theta, hai biểu diễn nhúng được so sánh để dự đoán xác suất cùng lớp.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="320" fill="#fff"/><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle" fill="#172554"><rect x="45" y="55" width="150" height="75" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><rect x="45" y="205" width="150" height="75" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="120" y="104">x(i)</text><text x="120" y="254">x(j)</text><rect x="285" y="55" width="220" height="75" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="285" y="205" width="220" height="75" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="395" y="104">f(theta)</text><text x="395" y="254">f(theta)</text><text x="395" y="166">dùng chung tham số</text><rect x="610" y="105" width="180" height="105" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="700" y="150">so sánh</text><text x="700" y="187">biểu diễn</text><rect x="850" y="105" width="120" height="105" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="910" y="150">P</text><text x="910" y="187">cùng lớp</text><path d="M200 92H275M200 242H275M510 92L600 135M510 242L600 180M795 157H840" stroke="#2f3e7a" stroke-width="4" fill="none" marker-end="url(#a)"/></g></svg>
