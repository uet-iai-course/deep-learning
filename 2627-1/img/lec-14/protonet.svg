<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="t d"><title id="t">Luồng tính ProtoNet</title><desc id="d">Tập hỗ trợ qua bộ mã hóa dùng chung rồi trung bình theo lớp thành prototype; tập truy vấn qua bộ mã hóa, tính khoảng cách tới mọi prototype, log-softmax và mất mát.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1100" height="340" fill="#fff"/><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle" fill="#172554"><rect x="25" y="50" width="175" height="75" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="112" y="99">Tập hỗ trợ</text><rect x="260" y="50" width="150" height="75" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="335" y="99">f(theta)</text><rect x="480" y="50" width="180" height="75" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="570" y="82">trung bình</text><text x="570" y="116">theo lớp</text><rect x="25" y="220" width="175" height="75" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="112" y="269">Tập truy vấn</text><rect x="260" y="220" width="150" height="75" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="335" y="269">f(theta)</text><rect x="735" y="125" width="165" height="90" rx="10" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="817" y="163">khoảng cách</text><text x="817" y="198">mọi lớp</text><rect x="925" y="125" width="165" height="90" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="1007" y="163">log-softmax</text><text x="1007" y="198">+ mất mát</text><path d="M205 87H250M415 87H470M665 87L725 145M205 257H250M415 257L725 195M905 170H915" stroke="#2f3e7a" stroke-width="4" fill="none" marker-end="url(#a)"/></g></svg>
