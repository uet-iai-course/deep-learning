<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Hợp đồng tập hỗ trợ và tập truy vấn</title><desc id="d">Một tác vụ được lấy từ phân phối tác vụ rồi tách thành tập hỗ trợ dùng để thích nghi và tập truy vấn dùng để tính mục tiêu.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f3e7a"/></marker></defs><rect width="1000" height="320" fill="#fff"/><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle" fill="#172554"><rect x="50" y="105" width="210" height="100" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="155" y="150">p(T)</text><text x="155" y="187">lấy tác vụ</text><rect x="365" y="45" width="270" height="105" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="500" y="92">Tập hỗ trợ S</text><text x="500" y="129">thích nghi</text><rect x="365" y="190" width="270" height="105" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="500" y="237">Tập truy vấn Q</text><text x="500" y="274">tính mục tiêu</text><rect x="760" y="105" width="190" height="100" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="855" y="150">cập nhật</text><text x="855" y="187">tham số chung</text><path d="M265 150L355 95M265 165L355 240M640 240L750 170" stroke="#2f3e7a" stroke-width="4" fill="none" marker-end="url(#a)"/></g></svg>
