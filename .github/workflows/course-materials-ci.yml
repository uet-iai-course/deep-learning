name: Kiểm định học liệu

on:
  push:
    branches: [main]
    paths:
      - "2627-1/**"
      - "scripts/validate_course.py"
      - "tests/course-materials.spec.js"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/course-materials-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "2627-1/**"
      - "scripts/validate_course.py"
      - "tests/course-materials.spec.js"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/course-materials-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-materials-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Kiểm định tĩnh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Kiểm tra cấu trúc, liên kết và hợp đồng học liệu
        run: python3 scripts/validate_course.py

  browser-validation:
    name: Dựng bằng Chromium
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Cài phụ thuộc khóa phiên bản
        run: npm ci
      - name: Cài Chromium và thư viện hệ thống
        run: npx playwright install --with-deps chromium
      - name: Kiểm định RevealJS và lecture-note viewer
        run: npm run test:browser
      - name: Lưu báo cáo khi kiểm định thất bại
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
